name: Prepare Fluent validation dependencies
on:
  push:
    branches: [work/preview29-fluent-validation]
    paths: [.github/workflows/prepare-fluent-validation.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore the pinned public formatting tool
        run: dotnet build tools/SourceMaintenance -c Release -warnaserror
      - name: Archive only public SDK references and formatter dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fluent-deps
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          tar -czf /tmp/fluent-deps/aspnet-references.tar.gz -C "$root" packs/Microsoft.AspNetCore.App.Ref
          tar --exclude='*.nupkg' -czf /tmp/fluent-deps/formatter-packages.tar.gz -C "$HOME/.nuget/packages" .
          dotnet --info > /tmp/fluent-deps/sdk.txt
          sha256sum /tmp/fluent-deps/*.gz > /tmp/fluent-deps/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: fluent-validation-dependencies
          path: /tmp/fluent-deps/
          compression-level: 0
          retention-days: 3
