name: Prepare preview21 segmented cache
on:
  push:
    branches: [work/preview21-uno-theme-native-drag]
    paths: [.github/workflows/prepare-preview21-cache.yml]
permissions:
  actions: read
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview21-desktop-packages
          run-id: 36124819320
          github-token: ${{ github.token }}
          path: cache
      - run: |
          split -b 400M cache/packages.tar.gz cache/part-
          sha256sum cache/packages.tar.gz cache/part-*
      - uses: actions/upload-artifact@v4
        with:
          name: preview21-cache-a
          path: cache/part-aa
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: preview21-cache-b
          path: cache/part-ab
          compression-level: 0
          retention-days: 3
