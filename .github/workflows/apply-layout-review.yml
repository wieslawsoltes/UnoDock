name: Apply reviewed layout invariants
on:
  push:
    branches: [work/preview24-layout-invariants-format]
    paths: [.github/workflows/apply-layout-review.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Integrate reviewed model partials
        run: python3 tools/apply-layout-review.py
      - name: Preserve product edits on the review branch only
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/apply-layout-review.py .github/workflows/apply-layout-review.yml
          git add src/ samples/ tests/
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: integrate coherent ownership commits and serialized activation'
          git fetch origin work/preview24-layout-invariants-format
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview24-layout-invariants-format
      - name: Compile actual Uno desktop application
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Install real headless desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Execute the new invariant suite in the actual Uno host
        env:
          UNODOCK_SELFTEST: '1'
          UNODOCK_TEST_SUITE: layout-mutation-invariants
        run: xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/model-invariants --selector layout-mutation-invariants --suite-timeout 90 --total-timeout 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-invariant-integration
          path: artifacts/
