name: Integrate validated XAML density and policies
on:
  push:
    branches: [work/preview26-xaml-density-policies]
    paths: [.github/workflows/integrate-xaml-density.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify transport and exact locally tested product tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 30837351ecfa181874dd121d0a44a528a8b75a3c
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          parts = ['928e8e2fd8bc68683acbca38242e16cd9a817ae0',
                   '5c8c56bb4f52ca75aae09b587715241de67c41ea',
                   '475d45f439975eb92af124494968a8f58198c551',
                   'b5a634499ae9602657bf02d6b8dd1e09e4f35335',
                   '6384e700fa255673e28f4c8024e22e9b97ecd2f5',
                   '1907f14dccb55652752276c86be6551cd66d3125']
          data = bytearray()
          for sha in parts:
              request = urllib.request.Request('https://api.github.com/repos/wieslawsoltes/UnoDock/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  part = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(f'blob {len(part)}\0'.encode() + part).hexdigest() == sha
              data.extend(part)
          assert len(data) == 18978
          patch = gzip.decompress(data)
          assert len(patch) == 96792
          assert hashlib.sha256(patch).hexdigest() == '73002167af4db2301c4c180475848c84fa097fa1cae5176b2e26e11fd6305e78'
          Path('/tmp/xaml-density.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', '/tmp/xaml-density.patch'], check=True)
          subprocess.run(['git', 'apply', '--index', '/tmp/xaml-density.patch'], check=True)
          PY
          git rm .github/workflows/integrate-xaml-density.yml
          test "$(git write-tree)" = 9d27aa7d707281b444fcebe422b6abdf48856495
          git diff --exit-code
          git diff --cached --check
      - name: Verify canonical source and unchanged generated/reference contracts
        run: |
          dotnet run --project tools/SourceMaintenance -c Release -- --check .
          dotnet run --project tools/SourceMaintenance -c Release -- --check-format .
          python3 tools/generate-property-adapters.py
          python3 tests/metadata/test_namespace_migration.py
          git diff HEAD^ --exit-code -- 'src/**/*.g.cs' contracts/ tools/ReferenceProbe/
      - name: Build actual Uno XAML host and execute portable core
        run: |
          dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
          dotnet run --project tests/UnoDock.Core.Tests -c Release -- artifacts/core
      - name: Install isolated native display
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Execute real compiled XAML and model invariants
        run: |
          xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/xaml-tests --selector xaml-workbench
          xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/model-tests --selector layout-mutation-invariants
      - name: Commit only the verified product tree and retire this worker
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = 9d27aa7d707281b444fcebe422b6abdf48856495
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: configurable chrome density and source-backed tool policy bindings'
          git fetch origin work/preview26-xaml-density-policies
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview26-xaml-density-policies
          git rev-parse HEAD > artifacts/source-revision.txt
          git rev-parse HEAD^{tree} > artifacts/source-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xaml-density-integration
          path: artifacts/
          if-no-files-found: warn
