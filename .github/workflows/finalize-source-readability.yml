name: Finalize accessor readability
on:
  push:
    branches: [work/preview24-model-invariants-formatting]
    paths: [.github/workflows/finalize-source-readability.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Integrate accessor trivia rule and its regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/SourceMaintenance/Program.Formatting.cs')
          text=p.read_text()
          old='                text = Formatter.Format(syntax, workspace, options).ToFullString().TrimEnd() + "\\n";'
          assert text.count(old)==1
          p.write_text(text.replace(old,'                syntax = SeparateAccessors(syntax);\n'+old))
          p=Path('tests/metadata/test_source_formatting.py'); text=p.read_text()
          old='    def test_no_source_cannot_pass(self):'
          assert text.count(old)==1
          new='''    def test_expression_accessors_have_separate_lines(self):
                  path = self.write('class A{int field;public int Value{get=>field;internal set=>field=value;}}')
                  self.run_tool()
                  text = path.read_text()
                  self.assertIn('get => field;\\n', text)
                  self.assertIn('internal set => field = value;', text)
                  self.assertNotIn('get => field; internal', text)
                  self.run_tool('--check-format')
          
          '''
          p.write_text(text.replace(old,new+old))
          PY
      - name: Validate formatter behavior and repository output
        run: |
          dotnet build tools/SourceMaintenance -c Release -warnaserror
          python3 tests/metadata/test_source_maintenance.py
          python3 tests/metadata/test_source_formatting.py
          dotnet tools/SourceMaintenance/bin/Release/net10.0/SourceMaintenance.dll --format .
          dotnet tools/SourceMaintenance/bin/Release/net10.0/SourceMaintenance.dll --check .
          dotnet tools/SourceMaintenance/bin/Release/net10.0/SourceMaintenance.dll --check-format .
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- 'src/**/*.g.cs' tools/ReferenceProbe
          git diff --check
      - name: Build actual Uno host
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Preserve verified source and remove worker
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-source-readability.yml
          git add src/ samples/ tests/ tools/
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'style: separate property accessor declarations without changing executable tokens'
          git fetch origin work/preview24-model-invariants-formatting
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview24-model-invariants-formatting
