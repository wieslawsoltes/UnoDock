name: Probe managed browser startup
on:
  push:
    branches: [work/browser-workspace-pages]
    paths: [.github/workflows/probe-browser-managed-startup.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add diagnostic stage markers to the build only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); text=p.read_text(); assert text.count(old)==1, (path,old)
              p.write_text(text.replace(old,new))
          path='samples/UnoDock.Gallery/Platforms/WebAssembly/Program.cs'
          Path(path).write_text('''using Uno.UI.Hosting;
          namespace UnoDock.Gallery;
          public static class Program {
              public static async Task Main(string[] args) {
                  Console.WriteLine("UNO PROBE: managed Main entered");
                  var host = UnoPlatformHostBuilder.Create().App(() => { Console.WriteLine("UNO PROBE: creating App"); return new App(); }).UseWebAssembly().Build();
                  Console.WriteLine("UNO PROBE: host built");
                  await host.RunAsync();
                  Console.WriteLine("UNO PROBE: host returned");
              }
          }
          ''')
          replace('samples/UnoDock.Gallery/App.xaml.cs', '        if (TryLaunchBrowserWorkspace())', '        Console.WriteLine("UNO PROBE: OnLaunched");\n        if (TryLaunchBrowserWorkspace())')
          path='samples/UnoDock.Gallery/App.Browser.cs'
          replace(path,'#if __WASM__','#if __WASM__\n        Console.WriteLine("UNO PROBE: WASM launch branch");')
          replace(path,'        _window = new Window { Content = new BrowserWorkspacePage() };','        Console.WriteLine("UNO PROBE: creating browser page");\n        _window = new Window { Content = new BrowserWorkspacePage() };\n        Console.WriteLine("UNO PROBE: page created");') if '        _window = new Window { Content = new BrowserWorkspacePage() };' in Path(path).read_text() else None
          path='samples/UnoDock.Gallery/BrowserWorkspacePage.xaml.cs'
          replace(path,'        InitializeComponent();','        Console.WriteLine("UNO PROBE: InitializeComponent start");\n        InitializeComponent();\n        Console.WriteLine("UNO PROBE: InitializeComponent done");')
          replace(path,'        if (_session != null)','        Console.WriteLine("UNO PROBE: Loaded, session=" + (_session != null));\n        if (_session != null)')
          replace(path,'            _timer.Start();','            Console.WriteLine("UNO PROBE: Session constructed");\n            _timer.Start();')
          replace(path,'            Status.Text = "Browser workspace startup failed: " + error.Message;','            Console.WriteLine("UNO PROBE ERROR: " + error);\n            Status.Text = "Browser workspace startup failed: " + error.Message;')
          path='src/UnoDock.Browser/BrowserDockingSession.cs'
          replace(path,'        Apply(Read("ready"));','        Console.WriteLine("UNO PROBE: session ready start");\n        Apply(Read("ready"));\n        Console.WriteLine("UNO PROBE: session ready done");')
          replace(path,'        var incoming = snapshot.Items.ToDictionary(item => item.Id, StringComparer.Ordinal);','        Console.WriteLine("UNO PROBE: Apply " + snapshot.Items.Length);\n        var incoming = snapshot.Items.ToDictionary(item => item.Id, StringComparer.Ordinal);')
          replace(path,'                        var view = _factory.Create(', '                        Console.WriteLine("UNO PROBE: factory " + item.Id);\n                        var view = _factory.Create(')
          replace(path,'                        Insert(model, item.Zone);','                        Console.WriteLine("UNO PROBE: insert " + item.Id);\n                        Insert(model, item.Zone);\n                        Console.WriteLine("UNO PROBE: inserted " + item.Id);')
          replace(path,'            _manager.Refresh();','            Console.WriteLine("UNO PROBE: Refresh start");\n            _manager.Refresh();\n            Console.WriteLine("UNO PROBE: Refresh done");')
          PY
      - name: Compile diagnostic WebAssembly build
        run: |
          dotnet workload install wasm-tools > /tmp/wasm-install.log 2>&1
          dotnet publish samples/UnoDock.Gallery -c Release -f net10.0-browserwasm -p:UnoDockTargetFrameworks=net10.0-browserwasm -p:UnoDockLibraryFrameworks=net10.0 -p:WasmShellWebAppBasePath=/UnoDock/gallery/ -o artifacts/publish > /tmp/wasm-publish.log 2>&1 || { tail -100 /tmp/wasm-publish.log; exit 1; }
          python3 -m pip install Markdown==3.8.2
          python3 tools/build-browser-site.py --publish artifacts/publish --output artifacts/serve/UnoDock
      - name: Install browser
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium > /tmp/chromium-install.log 2>&1
      - name: Observe initialization with a bounded process lifetime
        working-directory: tests/browser
        run: |
          python3 -m http.server 8765 --directory ../../artifacts/serve > ../../artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          timeout 50s node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          page.on('console', m => console.log('BROWSER', m.type(), m.text().slice(0, 5000)));
          page.on('pageerror', e => console.log('PAGE ERROR', e.stack));
          page.on('requestfailed', r => console.log('NETWORK',r.url(),r.failure()));
          page.goto('http://127.0.0.1:8765/UnoDock/playground/', { waitUntil: 'domcontentloaded', timeout: 10000 }).catch(e => console.log('NAVIGATION',e.message));
          await new Promise(resolve=>setTimeout(resolve,30000));
          const result = await Promise.race([page.evaluate(()=>({ ready:document.readyState, applied:window.UnoDockBrowser?.applied, status:document.querySelector('#status')?.textContent, frame:document.querySelector('iframe')?.contentDocument?.body.innerText.slice(0,3000) })),new Promise(resolve=>setTimeout(()=>resolve('Renderer main thread unresponsive'),3000))]);
          console.log('FINAL STATE', JSON.stringify(result));
          if (result !== 'Renderer main thread unresponsive') await page.screenshot({ path:'../../artifacts/managed-probe.png',timeout:3000 }).catch(()=>{});
          console.log('DIAGNOSTIC FINISHED');
          process.exit(0);
          JS
      - name: Retain diagnostic source delta
        if: always()
        run: |
          mkdir -p artifacts/probe
          git diff > artifacts/probe/instrumentation.patch
          cp /tmp/wasm-publish.log artifacts/probe/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-browser-probe
          path: |
            artifacts/probe/
            artifacts/managed-probe.png
