name: Complete disposed model notification guard
on:
  push:
    branches: [work/preview26-xaml-density-policies]
    paths: [.github/workflows/complete-disposed-notification.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Register adversarial in-flight notification tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/UnoDock.VisualTests/XamlWorkbenchTests.cs')
          text=path.read_text()
          anchor='        XamlBindingCleanupTests.Add(tests);'
          assert text.count(anchor)==1
          path.write_text(text.replace(anchor,anchor+'\n        XamlDisposedNotificationTests.Add(tests);'))
          PY
      - name: Compile real Uno host
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Install isolated test display
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Reproduce only the two newly identified lifetime failures
        run: |
          set +e
          xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/baseline --selector xaml-workbench --suite-timeout 150 --total-timeout 240
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases=ET.parse('artifacts/baseline/xaml-workbench.xml').getroot().findall('testcase')
          failed=[c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          assert len(cases)==86 and len(failed)==2
          assert all('in-flight model event' in c.get('name','') for c in failed)
          assert not any(c.find('skipped') is not None for c in cases)
          print('Baseline:',len(cases),'executed;',len(failed),'in-flight lifetime failures reproduced.')
          PY
      - name: Guard retired adapters before processing a captured model notification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/UnoDock/Controls/LayoutItem.cs'); text=path.read_text()
          anchor='    private void ModelChanged(object? sender, PropertyChangedEventArgs args)\n    {'
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+'\n        // Unsubscription does not revoke an already captured multicast delivery.\n        if (_disposed)\n            return;')
          path.write_text(text)
          path=Path('docs/xaml-workbench.md'); text=path.read_text()
          text=text.replace("host'ssurface", "host's surface")
          text=text.replace('The suite has 84 cases, including 14 binding/disposal cleanup regressions.',
              'The suite has 86 cases, including 16 binding/disposal cleanup regressions.')
          anchor='and tool adapters, failure aggregation, recovery and reentrant binding ownership.'
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+' Two additional\ncases deliver a model event captured before disposal: a subscriber registered\nbefore the adapter disposes it first, and the remaining captured delivery must\nnot repopulate its cleared Model, DataContext or presenter. The model itself\nretains its new application payload.')
          path.write_text(text)
          PY
          dotnet run --project tools/SourceMaintenance -c Release -- --format .
          dotnet run --project tools/SourceMaintenance -c Release -- --check .
          dotnet run --project tools/SourceMaintenance -c Release -- --check-format .
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- 'src/**/*.g.cs' contracts/ tools/ReferenceProbe/
      - name: Compile and verify all 86 XAML cases with the same assertions
        run: |
          dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
          xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/fixed --selector xaml-workbench --suite-timeout 150 --total-timeout 240
      - name: Commit validated guard and remove preparation workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/complete-disposed-notification.yml
          git add src/ tests/ docs/
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: ignore in-flight model notifications after layout-item disposal'
          git fetch origin work/preview26-xaml-density-policies
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview26-xaml-density-policies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xaml-disposed-notification-review
          path: artifacts/
          if-no-files-found: error
