name: Integrate preview 14 sources
on:
  push:
    branches: [work/preview14-samples-namespaces]
    paths: [.github/workflows/integrate-preview14.yml]
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/preview14-samples-namespaces
      - name: Apply exact reviewed product sources after deterministic namespace migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor b9c6d561aea20a869b8623ea259cb176e466e377 HEAD
          git diff --exit-code b9c6d561aea20a869b8623ea259cb176e466e377 HEAD -- src samples tests contracts Directory.Build.props README.md
          python3 tools/migrate-namespaces.py
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          blobs = ['dc9f2ea636590839d425bfc2a4a99cc01a7341f3','58cc0461615c69d3aaea409a721f257fb00a6d49','5a6229c9c3ff1ea274b802281906dd52f7616c64','8f80cfc4a2f5bbcb297470673d744fee2760ddfe']
          encoded = b''
          for sha in blobs:
              data=json.loads(subprocess.check_output(['gh','api','repos/wieslawsoltes/UnoDock/git/blobs/'+sha]))
              content=base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()==sha
              encoded+=content
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='a6509637dd40bea0cbdfd0a9dd38efeae20c96238d6b6c94e60253b106636a6c'
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'preview14.patch'
          patch.write_bytes(lzma.decompress(packed))
          exclusion='--exclude=.github/workflows/visual-reference.yml'
          subprocess.run(['git','apply',exclusion,'--check',str(patch)],check=True)
          subprocess.run(['git','apply',exclusion,str(patch)],check=True)
          PY
          python3 tools/generate-property-adapters.py
          python3 tests/metadata/test_namespace_migration.py
          python3 tests/metadata/test_metadata.py
          git diff --check
      - name: Commit complete product sources and dispatch platform validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src samples tests tools docs contracts README.md Directory.Build.props
          git diff --cached --check
          git commit -m 'feat!: rename namespaces to UnoDock and rebuild classic samples with live property inspection and native quality tests'
          git push origin HEAD:work/preview14-samples-namespaces
          gh workflow run ci.yml --ref work/preview14-samples-namespaces
