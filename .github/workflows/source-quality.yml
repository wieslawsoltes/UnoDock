name: Source organization and formatting
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Require one handwritten top-level type per file
        run: dotnet run --project tools/SourceMaintenance -c Release -- --check .
      - name: Test the actual source organizer against adversarial fixtures
        run: python3 tests/metadata/test_source_maintenance.py
      - name: Require the checked-in EditorConfig formatting
        run: dotnet format whitespace . --folder --include src samples tests tools --exclude tools/ReferenceProbe --verify-no-changes --verbosity minimal
      - name: Keep generated adapters and compatibility baselines deterministic
        run: |
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- src/
          python3 tests/metadata/test_namespace_migration.py
