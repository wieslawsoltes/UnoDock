name: Source organization and formatting
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Require one handwritten top-level type per file
        run: dotnet run --project tools/SourceMaintenance -c Release -- --check .
      - name: Test source organization, formatting and compiled XAML contracts
        run: |
          python3 tests/metadata/test_source_maintenance.py
          python3 tests/metadata/test_source_formatting.py
          python3 tests/metadata/test_xaml_sources.py
      - name: Require expanded and token-preserving source formatting
        run: dotnet run --project tools/SourceMaintenance -c Release -- --check-format .
      - name: Preserve generated adapters and compatibility baselines
        run: |
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- src/
          python3 tests/metadata/test_namespace_migration.py
