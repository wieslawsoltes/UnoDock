name: Prepare pinned Uno SDK
on:
  push:
    branches: [work/preview15-inspector-quality]
    paths: [.github/workflows/prepare-preview15.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore pinned Uno SDK and generic desktop
        run: dotnet restore samples/UnoDock.Gallery -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0
      - name: Export only SDK package without credentials or application data
        run: tar -czf "$RUNNER_TEMP/uno-sdk.tar.gz" -C "$HOME/.nuget/packages" uno.sdk
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-uno-sdk
          path: ${{ runner.temp }}/uno-sdk.tar.gz
          retention-days: 1
