name: Prepare preview16 targeting packs
on:
  push:
    branches: [work/preview16-mvvm-workspace]
    paths: [.github/workflows/prepare-preview16.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Export framework packs without credentials or reference product data
        run: |
          root=$(dirname "$(readlink -f "$(which dotnet)")")
          stage="$RUNNER_TEMP/packs"
          mkdir -p "$stage"
          tar -czf "$stage/dotnet-packs.tar.gz" -C "$root" packs shared/Microsoft.AspNetCore.App
          tar -czf "$stage/windowsdesktop-ref.tar.gz" -C "$HOME/.nuget" packages/microsoft.windowsdesktop.app.ref
      - uses: actions/upload-artifact@v4
        with:
          name: preview16-framework-packs
          path: ${{ runner.temp }}/packs/
          retention-days: 1
