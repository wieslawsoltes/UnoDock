name: Finish language-aware source formatting
on:
  push:
    branches: [work/preview24-model-invariants-formatting]
    paths: [.github/workflows/finish-source-formatting.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test the pinned language-aware formatter
        run: |
          dotnet build tools/SourceMaintenance -c Release -warnaserror
          python3 tests/metadata/test_source_maintenance.py
          python3 tests/metadata/test_source_formatting.py
      - name: Format handwritten files and independently verify stable output
        run: |
          dotnet tools/SourceMaintenance/bin/Release/net10.0/SourceMaintenance.dll --format .
          dotnet tools/SourceMaintenance/bin/Release/net10.0/SourceMaintenance.dll --check .
          dotnet tools/SourceMaintenance/bin/Release/net10.0/SourceMaintenance.dll --check-format .
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- 'src/**/*.g.cs' tools/ReferenceProbe
          git diff --check
      - name: Build actual Uno host and portable core
        run: |
          dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
          dotnet run --project tests/UnoDock.Core.Tests -c Release -- artifacts/core-format-validation
      - name: Publish reviewed whitespace changes and remove worker
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finish-source-formatting.yml
          git add src/ samples/ tests/ tools/
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'style: apply language-aware C# formatting with token-preservation verification'
          git fetch origin work/preview24-model-invariants-formatting
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview24-model-invariants-formatting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formatting-completion
          path: artifacts/
