name: Prepare validation toolchain
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assemble offline CSharp validation tools
        run: |
          set -euo pipefail
          root=$(dirname "$(readlink -f "$(which dotnet)")")
          sdk=$(dotnet --version)
          stage="$RUNNER_TEMP/compiler"
          mkdir -p "$stage/host" "$stage/shared/Microsoft.NETCore.App" "$stage/packs/Microsoft.NETCore.App.Ref" "$stage/compiler"
          cp "$root/dotnet" "$stage/"
          cp -a "$root/host/fxr" "$stage/host/"
          cp -a "$root/shared/Microsoft.NETCore.App/"10.* "$stage/shared/Microsoft.NETCore.App/"
          cp -a "$root/packs/Microsoft.NETCore.App.Ref/"10.* "$stage/packs/Microsoft.NETCore.App.Ref/"
          cp -a "$root/sdk/$sdk/Roslyn/bincore/"* "$stage/compiler/"
          tar -cf "$RUNNER_TEMP/offline-compiler.tar" -C "$stage" .
      - uses: actions/upload-artifact@v4
        with:
          name: offline-compiler
          path: ${{ runner.temp }}/offline-compiler.tar
          retention-days: 1
      - name: Generate official Uno application and library templates
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('contracts/versions.json'))['Uno.Templates'])")
          dotnet new install "Uno.Templates@$version"
          dotnet new unoapp -preset=blank -o "$RUNNER_TEMP/generated/Sample"
          dotnet new unolib -o "$RUNNER_TEMP/generated/Library"
      - uses: actions/upload-artifact@v4
        with:
          name: uno-templates
          path: ${{ runner.temp }}/generated/
