name: Integrate preview15 inspector
on:
  push:
    branches: [work/preview15-inspector-quality]
    paths: [.github/workflows/integrate-preview15.yml]
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/preview15-inspector-quality
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify and apply the complete reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor 4bd5d97e3dc284ba74eff6dc3692ada571f44399 HEAD
          git diff --exit-code 4bd5d97e3dc284ba74eff6dc3692ada571f44399 HEAD -- src samples tests contracts docs README.md Directory.Build.props
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          pieces=[]
          for sha in ['2ee794e9d613720de0535694b4cee337a7f356e7','683ebbf56d787e14417767c4fa2a13db5208683f']:
              blob=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              value=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()==sha
              pieces.append(value)
          packed=b''.join(pieces)
          assert hashlib.sha256(packed).hexdigest()=='781247a7f1b27ae8e2d73c77917f701a9eed28caacec08e5c9674ec29282a228'
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'preview15.patch'
          patch.write_bytes(lzma.decompress(packed))
          stats=subprocess.check_output(['git','apply','--numstat',str(patch)],text=True)
          expected={'Directory.Build.props','README.md','docs/inspector-quality.md','samples/UnoDock.Gallery/App.xaml.cs','samples/UnoDock.Gallery/GalleryPage.Samples.cs','samples/UnoDock.Gallery/SampleChrome.cs','samples/UnoDock.Gallery/SamplePropertyInspector.cs','tests/UnoDock.VisualTests/InspectorQualityTests.cs'}
          names=[line.split('\t',2)[2] for line in stats.splitlines()]
          assert len(names)==8 and set(names)==expected,names
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          print(stats)
          PY
      - name: Build complete Uno SDK and sample XAML with warnings as errors
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Run portable, namespace and deterministic metadata gates
        run: |
          dotnet run --project tests/UnoDock.Core.Tests -c Release -- artifacts/test-results
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- src/
          python3 tests/metadata/test_namespace_migration.py
          bash tools/check-metadata.sh
          git diff --cached --check
      - name: Commit complete product sources and dispatch platform validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add typed classic inspector with conflict-safe editing and native regression coverage'
          git push origin HEAD:work/preview15-inspector-quality
          git rev-parse HEAD > artifacts/integrated-revision.txt
          gh workflow run ci.yml --ref work/preview15-inspector-quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspector-integration-results
          path: artifacts/
