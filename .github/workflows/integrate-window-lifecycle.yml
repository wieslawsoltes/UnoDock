name: Integrate window lifecycle continuation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/integrate-window-lifecycle.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: integrate-window-lifecycle
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply complete verified source patch without replacing concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, json, os, pathlib, subprocess, urllib.request
          shas = ['103532f025803b38d1f5a6af25f3ad51cb52ab82', '8cafe16bf568d762e2a2308c5627bd9132b7c688', 'fb6986878190525efbb6b28145a15b2cbe24e4de', '2972fedb4ba52b9d5a4b541e24d7c295faf0b7f5']
          pieces = []
          for sha in shas:
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response: blob = json.load(response)
              value = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest() == sha
              pieces.append(value)
          data = b''.join(pieces)
          assert hashlib.sha256(data).hexdigest() == '060a98c71b866da582901e54ab44ad74ae617f7acbbe5978317f9867ff248ea1'
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'window-lifecycle.patch'
          patch.write_bytes(lzma.decompress(data))
          statistics = subprocess.check_output(['git','apply','--numstat',str(patch)],text=True)
          paths = [row.split('\t',2)[2] for row in statistics.splitlines()]
          assert len(paths) == 23
          for name in paths:
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in ('src','tests','samples','docs','contracts','Directory.Build.props','README.md')
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          print(statistics)
          PY
      - name: Run tests and verify resolved API no-regression gate
        run: |
          dotnet run --project tests/UnoDock.Core.Tests -c Release -- artifacts/test-results
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- src/
          bash tools/check-metadata.sh
          git diff --cached --check
      - name: Commit implementation and dispatch full platform validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement floating lifecycle hooks, native message filters, persisted restore geometry and two-list navigation'
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
          git rev-parse HEAD > artifacts/integrated-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-lifecycle-integration
          path: artifacts/
