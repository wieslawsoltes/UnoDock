name: WinUI Gallery (iteration)
on:
  push:
    branches: [work/winui-gallery]
permissions:
  contents: read
jobs:
  winui:
    name: Gallery on native WinUI
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      UNODOCK_SELFTEST: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v3
      - name: Build the Gallery native WinUI head
        run: msbuild samples/UnoDock.Gallery/UnoDock.Gallery.csproj -restore -p:Configuration=Release -p:Platform=x64 -p:UnoDockTargetFrameworks=net10.0-windows10.0.26100.0 -p:UnoDockLibraryFrameworks=net10.0-windows10.0.26100.0 -v:minimal
      - name: Run every suite on native WinUI
        if: ${{ !contains(github.event.head_commit.message, '[build-only]') }}
        shell: bash
        run: |
          exe=$(find samples/UnoDock.Gallery/bin -name UnoDock.Gallery.exe | head -1)
          echo "app: $exe"
          python3 tools/run-desktop-tests.py --app "$exe" --output artifacts/winui --selector all --suite-timeout 300 --total-timeout 3000
      - name: Report application crashes
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/winui -Recurse -Filter crash.log | ForEach-Object { Get-Content $_ }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-60) } -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } | Select-Object -First 30 | ForEach-Object { "[$($_.ProviderName)] $($_.Message)" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: winui-gallery
          path: artifacts/winui/
      - name: Build the Gallery for ARM64 (local debugging)
        if: always()
        run: msbuild samples/UnoDock.Gallery/UnoDock.Gallery.csproj -restore -p:Configuration=Release -p:Platform=ARM64 -p:UnoDockTargetFrameworks=net10.0-windows10.0.26100.0 -p:UnoDockLibraryFrameworks=net10.0-windows10.0.26100.0 -v:minimal
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: winui-gallery-arm64
          path: samples/UnoDock.Gallery/bin/ARM64/Release/net10.0-windows10.0.26100.0/
          retention-days: 3
      - name: Collect XAML compiler output
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/xaml
          find samples/UnoDock.Gallery/obj src/UnoDock/obj -name 'XamlTypeInfo*.cs' -exec cp {} artifacts/xaml/ \; 2>/dev/null || true
          ls -la artifacts/xaml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xaml-compiler-output
          path: artifacts/xaml/
          if-no-files-found: ignore
