name: Dropdown native-host acceptance
on:
  push:
    branches: [work/dropdown-lifecycle-20260923]
    paths: ['src/UnoDock/Controls/DropDownControls.cs', 'src/UnoDock/Internal/DropDownMenuSession.cs', 'tests/UnoDock.VisualTests/DropDownQualityTests.cs', '.github/workflows/dropdown-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dropdown-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dropdown:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build real Uno SDK and XAML desktop
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Linux windowing dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Linux dropdown and XTEST acceptance
        if: runner.os == 'Linux'
        env:
          UNODOCK_SELFTEST: '1'
          UNODOCK_TEST_SUITE: dropdown-quality
          UNODOCK_NATIVE_INPUT_TESTS: '1'
          UNODOCK_TEST_RESULTS: ${{ github.workspace }}/artifacts/dropdown
        run: timeout 120s xvfb-run -a -s "-screen 0 1600x1000x24" dotnet run --project samples/UnoDock.Gallery -c Release -f net10.0-desktop --no-build -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0
      - name: Windows dropdown acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UNODOCK_SELFTEST: '1'
          UNODOCK_TEST_SUITE: dropdown-quality
          UNODOCK_TEST_RESULTS: ${{ github.workspace }}/artifacts/dropdown
        run: |
          $process = Start-Process dotnet -ArgumentList @('run','--project','samples/UnoDock.Gallery','-c','Release','-f','net10.0-desktop','--no-build','-p:UnoDockTargetFrameworks=net10.0-desktop','-p:UnoDockLibraryFrameworks=net10.0') -NoNewWindow -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Dropdown native-host timeout.' }
          exit $process.ExitCode
      - name: Summarize exact execution results
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('artifacts/dropdown/dropdown-quality.json')
          if not p.exists(): raise SystemExit('No dropdown execution report was produced.')
          results=json.loads(p.read_text())
          failures=[r for r in results if r['Error'] is not None]
          print(f'DROPDOWN {len(results)-len(failures)}/{len(results)} passed')
          for r in failures: print('FAIL '+r['Name']+'\n'+r['Error'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f'Dropdown: {len(results)-len(failures)}/{len(results)} passed.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dropdown-${{ runner.os }}
          path: artifacts/dropdown/
          if-no-files-found: warn
