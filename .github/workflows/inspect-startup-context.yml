name: Inspect startup context
on:
  push:
    branches: [work/browser-runtime-inspection]
    paths: [.github/workflows/inspect-startup-context.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbb19396509be54c126fc38e8d54d81b1d9c1d51
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify artifact application source identity
        run: git diff --exit-code c8efdf36f0523d0b2a705558756570c82a199bba HEAD -- src/UnoDock.Browser/BrowserDockingSession.cs src/UnoDock.Browser/Assets samples/
      - uses: actions/download-artifact@v4
        with:
          name: browser-documentation-site
          run-id: 36403124991
          github-token: ${{ github.token }}
          path: artifacts/serve/UnoDock
      - name: Install the committed browser lock
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright --version
          npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -30 /tmp/browser-install.log; exit 1; }
      - name: Execute all native scenarios without application instrumentation
        working-directory: tests/browser
        run: |
          python3 -m http.server 8765 --directory ../../artifacts/serve > ../../artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          timeout --signal=TERM --kill-after=15s 900s npx playwright test
      - name: Validate complete named evidence
        if: always()
        run: python3 tools/verify-browser-results.py artifacts/browser-tests
      - name: Show original failure context
        if: failure()
        run: find artifacts/browser-tests -name error-context.md -exec cat {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-browser-acceptance
          path: |
            artifacts/browser-tests/
            artifacts/http.log
            tests/browser/package.json
            tests/browser/package-lock.json
          if-no-files-found: error
