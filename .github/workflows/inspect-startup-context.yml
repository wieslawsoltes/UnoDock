name: Inspect startup context
on:
  push:
    branches: [work/browser-runtime-inspection]
    paths: [.github/workflows/inspect-startup-context.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 44d0cd5046a0a74394857c9e9e9a47707d0b63c3
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify artifact application source identity
        run: git diff --exit-code c8efdf36f0523d0b2a705558756570c82a199bba HEAD -- src/UnoDock.Browser/BrowserDockingSession.cs src/UnoDock.Browser/Assets samples/
      - uses: actions/download-artifact@v4
        with:
          name: browser-documentation-site
          run-id: 36403124991
          github-token: ${{ github.token }}
          path: artifacts/serve/UnoDock
      - name: Resolve and print exact current browser dependency lock
        working-directory: tests/browser
        run: |
          npm install --save-exact --ignore-scripts --no-audit --no-fund @playwright/test@1.63.0
          cat package.json package-lock.json
          npx playwright --version
          npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -30 /tmp/browser-install.log; exit 1; }
      - name: Run unchanged native acceptance with the new pinned browser
        working-directory: tests/browser
        run: |
          python3 -m http.server 8765 --directory ../../artifacts/serve > ../../artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          timeout --signal=TERM --kill-after=15s 900s npx playwright test
      - name: Validate complete named evidence
        if: always()
        run: |
          python3 tools/verify-browser-results.py artifacts/browser-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-browser-acceptance
          path: |
            artifacts/browser-tests/
            artifacts/http.log
            tests/browser/package.json
            tests/browser/package-lock.json
