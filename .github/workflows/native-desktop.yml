name: Native desktop docking
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UNODOCK_SELFTEST: '1'
      UNODOCK_TEST_SUITE: desktop-acceptance
      UNODOCK_NATIVE_INPUT_TESTS: '1'
      UNODOCK_INPUT_TRACE: '1'
      UNODOCK_TEST_RESULTS: ${{ github.workspace }}/artifacts/native-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build actual Uno SDK and XAML
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Install dedicated X11 display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Run actual X11 desktop docking and theme suites
        if: runner.os == 'Linux'
        run: timeout 240s xvfb-run -a -s "-screen 0 2560x1440x24" dotnet run --project samples/UnoDock.Gallery -c Release -f net10.0-desktop --no-build -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0
      - name: Run actual Win32 desktop docking and theme suites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arguments = @('run', '--project', 'samples/UnoDock.Gallery', '-c', 'Release', '-f', 'net10.0-desktop', '--no-build', '-p:UnoDockTargetFrameworks=net10.0-desktop', '-p:UnoDockLibraryFrameworks=net10.0')
          $process = Start-Process dotnet -ArgumentList $arguments -NoNewWindow -PassThru
          if (-not $process.WaitForExit(240000)) { $process.Kill($true); throw 'Native desktop tests timed out.' }
          exit $process.ExitCode
      - name: Run actual AppKit desktop docking and theme suites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(['dotnet', 'run', '--project', 'samples/UnoDock.Gallery', '-c', 'Release', '-f', 'net10.0-desktop', '--no-build', '-p:UnoDockTargetFrameworks=net10.0-desktop', '-p:UnoDockLibraryFrameworks=net10.0'], timeout=240, check=True)
          PY
      - name: Summarize and independently require complete passing JUnit evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/native-tests
          git rev-parse HEAD > artifacts/native-tests/source-revision.txt
          python3 tools/report-test-results.py artifacts/native-tests --output artifacts/native-tests/execution-summary.json
          python3 tools/verify-native-results.py artifacts/native-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-docking-${{ runner.os }}
          path: artifacts/native-tests/
          if-no-files-found: error
