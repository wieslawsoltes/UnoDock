name: Prepare preview21 desktop validation
on:
  push:
    branches: [work/preview21-uno-theme-native-drag]
    paths: [.github/workflows/prepare-preview21.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build the unmodified desktop baseline
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Archive only public SDK and package dependencies for offline validation
        run: |
          mkdir -p /tmp/validation
          sdkroot="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          tar -czf /tmp/validation/dotnet.tar.gz -C "$sdkroot" .
          tar -czf /tmp/validation/packages.tar.gz -C "$HOME/.nuget/packages" .
          dotnet --info > /tmp/validation/dotnet-info.txt
          git rev-parse HEAD > /tmp/validation/source-revision.txt
          sha256sum /tmp/validation/*.tar.gz > /tmp/validation/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: preview21-offline-toolchain
          path: /tmp/validation/
          compression-level: 0
          retention-days: 3
