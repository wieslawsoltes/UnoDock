name: Finalize XAML workbench coverage
on:
  push:
    branches: [work/preview25-xaml-workbench]
    paths: [.github/workflows/finalize-xaml-workbench.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify exact source and apply the reviewed continuation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d8486d04ff8ebe7a15001f0936d8b9b93b0226a0
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          sha = '58d9814270771be908c9ce2a4b97f6dadd0a5fd4'
          request = urllib.request.Request('https://api.github.com/repos/wieslawsoltes/UnoDock/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = base64.b64decode(json.load(response)['content'])
          def blob_sha(value):
              return hashlib.sha1(f'blob {len(value)}\0'.encode() + value).hexdigest()
          assert blob_sha(data) == sha
          # Repair a single verified transport symbol; both byte sequences and
          # the final source tree are pinned, so this cannot mask source changes.
          encoded = base64.b64encode(data).decode()
          assert encoded.count('ouphMfHNB') == 1
          data = base64.b64decode(encoded.replace('ouphMfHNB', 'ouphMFHNB'))
          assert blob_sha(data) == '191c1863d38c34f97823f5add2d4abd59a7f4941'
          patch = gzip.decompress(data)
          assert len(patch) == 43909
          assert hashlib.sha256(patch).hexdigest() == 'e4b881dec5b739425bea7875babf9e35458e8acfa555e008e7c775c306cccbe6'
          Path('/tmp/xaml-structure.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/xaml-structure.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/xaml-structure.patch'],check=True)
          PY
          git rm .github/workflows/finalize-xaml-workbench.yml
          test "$(git write-tree)" = 9c6cfc4d182cd021a417c4a27ebd248dbd0fdfbc
      - name: Check canonical formatting and unchanged generated adapters
        run: |
          dotnet run --project tools/SourceMaintenance -c Release -- --check .
          dotnet run --project tools/SourceMaintenance -c Release -- --check-format .
          python3 tools/generate-property-adapters.py
          git diff HEAD^ --exit-code -- 'src/**/*.g.cs' contracts/ tools/ReferenceProbe/
          git diff --check
      - name: Build actual compiled XAML application
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Install native test display
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Run all 32 focused XAML tests
        run: xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/xaml-tests --selector xaml-workbench
      - name: Commit the exact validated tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = 9c6cfc4d182cd021a417c4a27ebd248dbd0fdfbc
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: bind root and floating slots safely and validate compiled XAML on all desktop hosts'
          git fetch origin work/preview25-xaml-workbench
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview25-xaml-workbench
          git rev-parse HEAD > artifacts/source-revision.txt
          git rev-parse HEAD^{tree} > artifacts/source-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xaml-structure-evidence
          path: artifacts/
