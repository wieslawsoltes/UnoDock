name: Prepare reviewed model refactor
on:
  push:
    branches: [work/preview24-model-invariants-formatting]
    paths: [.github/workflows/prepare-model-refactor.yml, tools/apply-model-invariants.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Integrate reviewed ownership and activation fixes
        id: integrate
        run: python3 tools/apply-model-invariants.py
      - name: Organize every handwritten top-level type without changing tokens
        id: organize
        run: dotnet run --project tools/SourceMaintenance -c Release -- --apply .
      - name: Format handwritten C# with repository settings
        run: dotnet format whitespace . --folder --include src samples tests tools --exclude tools/ReferenceProbe --verbosity minimal
      - name: Verify organization and formatter idempotence
        run: |
          dotnet run --project tools/SourceMaintenance -c Release -- --check .
          dotnet format whitespace . --folder --include src samples tests tools --exclude tools/ReferenceProbe --verify-no-changes --verbosity minimal
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- '*Properties.g.cs'
      - name: Compile real Uno host
        id: build
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Portable core regression
        if: always() && steps.organize.outcome == 'success'
        run: dotnet run --project tests/UnoDock.Core.Tests -c Release -- artifacts/core-tests
      - name: Install native test display
        if: steps.build.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Run new invariant cases on the actual Uno UI thread
        if: steps.build.outcome == 'success'
        env:
          UNODOCK_SELFTEST: '1'
        run: xvfb-run -a -s "-screen 0 2560x1440x24" python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/invariant-tests --selector layout-mutation-invariants
      - name: Preserve the generated refactor on its isolated review branch
        if: always() && steps.organize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add src/ samples/ tests/ tools/ .editorconfig
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'refactor: organize and format handwritten sources; integrate model invariant fixes'
          git fetch origin work/preview24-model-invariants-formatting
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview24-model-invariants-formatting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-refactor-evidence
          path: artifacts/
