name: Complete XAML binding lifetime review
on:
  push:
    branches: [work/preview26-xaml-density-policies]
    paths: [.github/workflows/complete-xaml-cleanup.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Register public-API cleanup regressions
        run: python3 tools/complete-xaml-cleanup.py register
      - name: Build baseline with new regressions
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Install isolated native test display
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Reproduce cleanup failures without treating the baseline as passing
        shell: bash
        run: |
          set +e
          xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/baseline --selector xaml-workbench --suite-timeout 150 --total-timeout 240
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=ET.parse('artifacts/baseline/xaml-workbench.xml').getroot()
          cases=root.findall('testcase')
          failures=[c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          assert len(cases)==84 and int(root.get('tests'))==84
          assert failures and all(c.get('name','').startswith('XAML cleanup:') for c in failures)
          assert not any(c.find('skipped') is not None for c in cases)
          print('Baseline:',len(cases),'executed;',len(failures),'new cleanup regressions reproduced.')
          for c in failures: print(c.get('name'), ''.join(c.itertext()))
          PY
      - name: Apply reviewed cleanup and canonical formatting
        run: |
          python3 tools/complete-xaml-cleanup.py fix
          dotnet run --project tools/SourceMaintenance -c Release -- --format .
          dotnet run --project tools/SourceMaintenance -c Release -- --check .
          dotnet run --project tools/SourceMaintenance -c Release -- --check-format .
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- 'src/**/*.g.cs' contracts/ tools/ReferenceProbe/
      - name: Build final source and run all XAML cases
        run: |
          dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
          xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/fixed --selector xaml-workbench --suite-timeout 150 --total-timeout 240
      - name: Publish validated source only and remove temporary worker
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/complete-xaml-cleanup.py .github/workflows/complete-xaml-cleanup.yml
          git add src/ samples/ tests/
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: complete layout-item cleanup before propagating observer failures'
          git fetch origin work/preview26-xaml-density-policies
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview26-xaml-density-policies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xaml-cleanup-review
          path: artifacts/
          if-no-files-found: error
