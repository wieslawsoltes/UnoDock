name: Custom floating chrome
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floating-chrome-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chrome:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      UNODOCK_SELFTEST: '1'
      UNODOCK_TEST_SUITE: floating-chrome
      UNODOCK_NATIVE_INPUT_TESTS: '1'
      UNODOCK_REQUIRE_WM: ${{ runner.os == 'Linux' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build real Uno desktop host
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Install a real X11 window manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox x11-utils libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Exercise custom chrome under Openbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 2560x1440x24' bash -euo pipefail -c '
            openbox > /tmp/unodock-openbox.log 2>&1 & wm=$!
            trap "kill $wm 2>/dev/null || true" EXIT
            ready=0
            for attempt in $(seq 1 100); do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then ready=1; break; fi
              sleep .05
            done
            test "$ready" = 1
            python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/chrome --selector floating-chrome --suite-timeout 180 --total-timeout 240
          '
      - name: Exercise native custom chrome
        if: runner.os != 'Linux'
        shell: bash
        run: python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/chrome --selector floating-chrome --suite-timeout 180 --total-timeout 240
      - name: Require complete custom chrome evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/chrome
          git rev-parse HEAD > artifacts/chrome/source-revision.txt
          python3 tools/verify-floating-chrome.py artifacts/chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-floating-chrome-${{ runner.os }}
          path: artifacts/chrome/
          if-no-files-found: error
