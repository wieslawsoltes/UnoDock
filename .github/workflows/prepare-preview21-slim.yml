name: Prepare preview21 active SDK
on:
  push:
    branches: [work/preview21-uno-theme-native-drag]
    paths: [.github/workflows/prepare-preview21-slim.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build unmodified desktop baseline
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Select active SDK only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdk-artifact /tmp/packages-artifact
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          version="$(dotnet --version)"
          cd "$root"
          paths=(dotnet "sdk/$version" host/fxr/10.* shared/Microsoft.NETCore.App/10.* packs/Microsoft.NETCore.App.Ref/10.* packs/Microsoft.NETCore.App.Host.linux-x64/10.* packs/NETStandard.Library.Ref/2.*)
          tar -czf /tmp/sdk-artifact/dotnet.tar.gz "${paths[@]}"
          cd "$HOME/.nuget/packages"
          tar --exclude='*.nupkg' -czf /tmp/packages-artifact/packages.tar.gz .
          du -h /tmp/sdk-artifact/* /tmp/packages-artifact/*
          sha256sum /tmp/sdk-artifact/* /tmp/packages-artifact/*
      - uses: actions/upload-artifact@v4
        with:
          name: preview21-active-sdk
          path: /tmp/sdk-artifact/
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: preview21-desktop-packages
          path: /tmp/packages-artifact/
          compression-level: 0
          retention-days: 3
