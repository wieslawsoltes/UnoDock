name: Diagnose actual browser startup
on:
  push:
    branches: [work/browser-workspace-pages]
    paths: [.github/workflows/diagnose-browser-startup.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 36312920160
          name: browser-workspace-preparation
          github-token: ${{ github.token }}
          path: artifacts/original
      - name: Extract exceptions and network failures from original execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          root = Path('artifacts/original')
          for path in root.rglob('trace.zip'):
              print('TRACE', path)
              with zipfile.ZipFile(path) as archive:
                  print('FILES', archive.namelist()[:30])
                  for name in archive.namelist():
                      if not name.endswith(('.trace', '.network')):
                          continue
                      lines = archive.read(name).decode('utf-8', errors='replace').splitlines()
                      for line in lines:
                          try: item = json.loads(line)
                          except ValueError: continue
                          if name.endswith('.network'):
                              snapshot=item.get('snapshot', {})
                              response=snapshot.get('response', {})
                              if response.get('status', 200) >= 400 or snapshot.get('_failureText'):
                                  print('HTTP FAILURE', json.dumps(item)[:6000])
                          elif item.get('type') in ('console', 'event') or item.get('error'):
                              print('EVENT', json.dumps(item)[:8000])
          for path in root.rglob('http.log'):
              print('HTTP LOG LAST LINES\n', '\n'.join(path.read_text().splitlines()[-50:]))
          for path in root.rglob('package-lock.json'):
              print('PACKAGE LOCK\n', path.read_text())
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 36312920160
          name: browser-site-preview
          github-token: ${{ github.token }}
          path: artifacts/site
      - name: Inspect published bootstrap configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('artifacts/site/gallery')
          print('INDEX\n', (root/'index.html').read_text())
          for pattern in ['**/uno-config.js', '**/uno-bootstrap.js', '**/dotnet.boot.json']:
              for p in list(root.glob(pattern))[:2]:
                  text=p.read_text()
                  print('CONFIG',p,'\n',text[:14000])
          PY
