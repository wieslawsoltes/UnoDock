name: Apply reviewed input readiness fixes
on:
  push:
    branches: [work/preview24-input-worker]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Integrate explicit capture loss and bounded input readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pending = {}
          def replace(path, old, new):
              text = pending.get(path, Path(path).read_text())
              if text.count(old) != 1: raise RuntimeError(f'{path}: expected one exact anchor, got {text.count(old)}')
              pending[path] = text.replace(old, new)
          replace('src/UnoDock/Controls/LayoutGridResizerControl.cs', '        Unloaded += (_, _) => CancelDrag();', '''        // A captured Thumb is not guaranteed to raise DragCompleted when a
                  // host revokes its pointer capture. Handle the routed loss directly.
                  // Ordinary button-up loss is left to the existing release fence.
                  _thumb.AddHandler(PointerCaptureLostEvent, new PointerEventHandler((_, e) =>
                  {
                      if (_dragging && _pointer == e.Pointer.PointerId &&
                          e.GetCurrentPoint(_thumb).Properties.IsLeftButtonPressed)
                      {
                          CancelDrag();
                      }
                  }), true);
                  Unloaded += (_, _) => CancelDrag();''')
          p = 'tests/UnoDock.VisualTests/FloatingChromeTests.Fixture.cs'
          replace(p, '        internal async Task Click(FrameworkElement e)\n        {', '''        internal async Task Click(FrameworkElement e)
                  {
                      await PressOn(e);
                      await Task.Delay(50);
                      Release();
                  }

                  internal async Task PressOn(FrameworkElement e, Point? point = null)
                  {''')
          replace(p, '                var local = new Point(e.ActualWidth / 2, e.ActualHeight / 2);', '                var local = point ?? new Point(e.ActualWidth / 2, e.ActualHeight / 2);')
          replace(p, '                        Press();\n                        await Task.Delay(50);\n                        Release();\n                        return;', '                        Press();\n                        return;')
          p = 'tests/UnoDock.VisualTests/FloatingChromeTests.ResizePolicy.cs'
          # Only this terminal case used an arbitrary 60ms as proof of native capture.
          text = Path(p).read_text()
          marker = 'policy revocation releases a physical capture and clock'
          begin = text.index(marker)
          old = 'input.MoveTo(grip, down);\n                await Task.Delay(60);\n                input.Press();\n                await Task.Delay(60);\n                Check.True(f.Control.IsResizing);'
          if old not in text[begin:]: raise RuntimeError('Missing physical policy case press sequence')
          pending[p] = text[:begin] + text[begin:].replace(old, 'await input.PressOn(grip, down);\n                await Wait(() => f.Control.IsResizing);\n                Check.True(f.Control.IsResizing);', 1)
          p = 'tests/UnoDock.VisualTests/DockGuideTests.cs'
          replace(p, '''                await Task.Delay(100);
                          native.UpdateLayout();
                          await action(source, target, native, coordinates);''', '''                native.NativeWindow!.Activate();
                          Rect? previous = null;
                          var stable = 0;
                          while (stable < 3)
                          {
                              if (DateTime.UtcNow >= deadline)
                                  throw new TimeoutException("Native guide frame did not finish arranging.");
                              native.UpdateLayout();
                              var frame = FloatingChromeProbe.Bounds(native.NativeWindow!);
                              var scale = native.XamlRoot!.RasterizationScale;
                              var arranged = native.IsLoaded && native.NativeWindow!.AppWindow.IsVisible &&
                                  Math.Abs(native.ActualWidth * scale - frame.Width) <= 1 &&
                                  Math.Abs(native.ActualHeight * scale - frame.Height) <= 1 &&
                                  native.FindVisualChildren<LayoutAnchorablePaneControl>().Any(pane =>
                                      pane.IsLoaded && pane.ActualWidth > 0 && pane.ActualHeight > 0);
                              var current = new Rect(frame.X, frame.Y, frame.Width, frame.Height);
                              stable = arranged && previous == current ? stable + 1 : 0;
                              previous = current;
                              await Task.Delay(25);
                          }
                          await action(source, target, native, coordinates);''')
          for path, text in pending.items(): Path(path).write_text(text)
          PY
      - name: Canonical formatting and fixture validation
        run: |
          dotnet run --project tools/SourceMaintenance -c Release -- --format .
          dotnet run --project tools/SourceMaintenance -c Release -- --check-format .
          python3 tests/metadata/test_source_maintenance.py
          python3 tests/metadata/test_source_formatting.py
      - name: Compile actual Uno host with warnings as errors
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Commit reviewed source and remove the one-use workflow
        run: |
          git rm .github/workflows/apply-reviewed-input.yml
          git add src/ tests/ tools/
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: retire splitter capture loss and await actual native input geometry'
          git fetch origin work/preview24-input-worker
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview24-input-worker
