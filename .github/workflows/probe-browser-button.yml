name: Probe browser property initialization
on:
  push:
    branches: [work/browser-workspace-pages]
    paths: [.github/workflows/probe-browser-button.yml]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [immediate, deferred]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace individual property boundaries without publishing instrumentation
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('src/UnoDock/Internal/DockChromeButton.cs'); text=p.read_text()
          for marker, token in [('palette','        _palette = palette;'),('corner','        CornerRadius = new(palette.ButtonCornerRadius);'),('border','        BorderThickness = new(_fluent ? 0 : 1);'),('font','        FontSize = palette.FontSize;'),('foreground','        Foreground = foreground;'),('icon','        PaintIcon();'),('background','        Background = IsEnabled && (IsPressed || _over) ? IsPressed ? _palette.Pressed : _palette.Hover : DockChrome.Transparent;'),('focus-border','        BorderBrush = FocusState == FocusState.Keyboard ? _palette.Accent : null;'),('opacity','        Opacity = IsEnabled ? 1 : .45;')]:
              assert text.count(token)==1,(marker,text.count(token))
              text=text.replace(token,'        Console.WriteLine("BUTTON '+marker+' begin");\n'+token+'\n        Console.WriteLine("BUTTON '+marker+' end");')
          p.write_text(text)
          if os.environ['MODE']=='deferred':
              p=Path('samples/UnoDock.Gallery/BrowserWorkspacePage.xaml.cs'); text=p.read_text()
              token='    private void OnLoaded(object sender, RoutedEventArgs args)\n    {'
              assert text.count(token)==1
              text=text.replace(token,'    private async void OnLoaded(object sender, RoutedEventArgs args)\n    {\n        await Task.Delay(20);')
              p.write_text(text)
          PY
      - name: Compile browser variant
        run: |
          dotnet workload install wasm-tools > /tmp/wasm-install.log 2>&1
          dotnet publish samples/UnoDock.Gallery -c Release -f net10.0-browserwasm -p:UnoDockTargetFrameworks=net10.0-browserwasm -p:UnoDockLibraryFrameworks=net10.0 -p:WasmShellWebAppBasePath=/UnoDock/gallery/ -o artifacts/publish > /tmp/wasm-publish.log 2>&1 || { tail -100 /tmp/wasm-publish.log; exit 1; }
          python3 -m pip install Markdown==3.8.2
          python3 tools/build-browser-site.py --publish artifacts/publish --output artifacts/serve/UnoDock
      - name: Install browser
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium > /tmp/chromium-install.log 2>&1
      - name: Capture the final control-property boundary
        working-directory: tests/browser
        run: |
          python3 -m http.server 8765 --directory ../../artifacts/serve > ../../artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          timeout 55s node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch();const page=await browser.newPage();const logs=[];
          page.on('console',m=>{logs.push(m.type()+': '+m.text());if(logs.length>500)logs.shift();});
          page.on('pageerror',e=>logs.push('PAGE ERROR '+e.stack));
          page.goto('http://127.0.0.1:8765/UnoDock/playground/',{waitUntil:'domcontentloaded',timeout:10000}).catch(e=>logs.push('NAV '+e.message));
          await new Promise(resolve=>setTimeout(resolve,30000));
          const result=await Promise.race([page.evaluate(()=>({applied:window.UnoDockBrowser?.applied,frame:document.querySelector('iframe')?.contentDocument?.body.innerText.slice(0,1500)})),new Promise(resolve=>setTimeout(()=>resolve('UI unresponsive'),3000))]);
          await fs.mkdir('../../artifacts/probe',{recursive:true});
          await fs.writeFile('../../artifacts/probe/browser.log',logs.join('\n'));
          console.log('FINAL LOGS\n'+logs.slice(-110).join('\n'));
          console.log('FINAL STATE',JSON.stringify(result));
          if(result!=='UI unresponsive')await page.screenshot({path:'../../artifacts/probe/browser.png',timeout:4000}).catch(()=>{});
          process.exit(0);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-button-${{ matrix.mode }}
          path: artifacts/probe/
