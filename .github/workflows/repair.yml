name: Apply interoperability corrections
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/repair.yml']
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source corrections and regenerate adapters
        run: |
          python3 tools/apply-interop-fixes.py
          python3 tools/generate-property-adapters.py
      - name: Commit and validate source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src samples tools
          git diff --cached --quiet || (git commit -m 'fix: align original XML layouts, defaults, docking policies and tab insertion semantics' && git pull --rebase origin main && git push origin HEAD:main)
          gh workflow run ci.yml --ref main
