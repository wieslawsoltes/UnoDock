name: Apply reviewed preview21 regression fixes
on:
  push:
    branches: [work/preview21-uno-theme-native-drag]
    paths: [.github/workflows/apply-preview21-reviewed.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply exact reviewed edits and check final tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 22478608e59d1af040dc7610db3c1427a3bd6fa6
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path); text = p.read_text()
              if text.count(old) != 1: raise RuntimeError(f'{path}: expected one anchor, got {text.count(old)}')
              p.write_text(text.replace(old, new))
          p = Path('src/UnoDock/DesktopWindowCoordinates.cs'); text = p.read_text()
          a = text.index('    internal bool TryGetTopmostRoot('); start = text.index('{', a); depth = 1; i = start + 1
          while depth:
              if text[i] == '{': depth += 1
              if text[i] == '}': depth -= 1
              i += 1
          p.write_text(text[:a] + '    internal bool TryGetTopmostRoot(FrameworkElement source, Point point, out XamlRoot? hitRoot)\n        => TryGetTopmostRootExcludingWindow(source, point, out hitRoot, null);' + text[i:])
          replace('src/UnoDock/DesktopWindowCoordinates.HitTest.cs', 'internal bool TryGetTopmostRoot(', 'internal bool TryGetTopmostRootExcludingWindow(')
          replace('src/UnoDock/Internal/DockSurface.cs', 'coordinates.TryGetTopmostRoot(this, point, out var hitRoot, _floatingDrag?.Window.NativeWindow)', 'coordinates.TryGetTopmostRootExcludingWindow(this, point, out var hitRoot, _floatingDrag?.Window.NativeWindow)')
          p = Path('tests/UnoDock.VisualTests/DesktopFloatingTests.cs'); p.write_text(p.read_text().replace('"TryGetTopmostRoot", args', '"TryGetTopmostRootExcludingWindow", args'))
          replace('tests/UnoDock.Runtime.Tests/InteractionTests.cs', '''                await input.Begin(caption, new(20, caption.ActualHeight / 2));
                          Check.Equal(UnoDock.Core.DockDragState.Dragging, DragState(host));''', '''                // Clicking the text must reach the retained whole-caption handle.
                          // The single-tab state machine is no longer its capture owner.
                          await input.Begin(caption, new(20, caption.ActualHeight / 2));
                          Check.True(floating.IsDragging, "Caption pointer input did not start a floating-window drag.");''')
          replace('tests/UnoDock.Runtime.Tests/InteractionTests.cs', '''                Check.False(docs[0].IsFloating);
                      });''', '''                Check.False(docs[0].IsFloating);
                          Check.False(floating.IsDragging);
                          Check.False(DragTimer(host).IsEnabled);
                      });''')
          replace('tests/UnoDock.Runtime.Tests/ShellTests.cs', '''                Check.True(caption.IsHitTestVisible);
                          Check.True(WindowChrome.GetIsHitTestVisibleInChrome(caption));''', '''                var handle = (Border)typeof(LayoutFloatingWindowControl).GetField("_dragHandle", System.Reflection.BindingFlags.Instance | System.Reflection.BindingFlags.NonPublic)!.GetValue(floating)!;
                          Check.False(caption.IsHitTestVisible); // The label cannot steal the shared handle's capture.
                          Check.True(handle.IsHitTestVisible);
                          Check.True(WindowChrome.GetIsHitTestVisibleInChrome(handle));''')
          p = Path('tests/UnoDock.Runtime.Tests/ShellTests.cs'); p.write_text(p.read_text().replace('Check.True(WindowChrome.GetIsHitTestVisibleInChrome(caption));', 'Check.True(WindowChrome.GetIsHitTestVisibleInChrome(handle));'))
          p = 'src/UnoDock/Internal/NativeDragClock.cs'
          replace(p, '    private bool _disposed;', '''    private readonly int _thread = Environment.CurrentManagedThreadId;
              private bool _disposed, _invoking;
              private const string AppKit = "/System/Library/Frameworks/AppKit.framework/AppKit";''')
          replace(p, '        _tick = tick; _failed = failed;', '''        ArgumentNullException.ThrowIfNull(tick);
                  ArgumentNullException.ThrowIfNull(failed);
                  _tick = tick; _failed = failed;''')
          replace(p, '        _self = GCHandle.Alloc(this);', '''        if (CurrentLoop() != MainLoop()) throw new InvalidOperationException("AppKit drag tracking requires its main UI thread.");
                  _self = GCHandle.Alloc(this);''')
          replace(p, '''            finally { NativeLibrary.Free(library); }
                  }
                  catch { Dispose(); throw; }''', '''            finally { NativeLibrary.Free(library); }
                      // The host may initialize its common-mode set lazily. Register the
                      // actual drag mode explicitly as well; invalidation removes both.
                      library = NativeLibrary.Load(AppKit);
                      try { AddTimer(MainLoop(), _timer, Marshal.ReadIntPtr(NativeLibrary.GetExport(library, "NSEventTrackingRunLoopMode"))); }
                      finally { NativeLibrary.Free(library); }
                  }
                  catch { Dispose(); throw; }''')
          replace(p, '''        if (_disposed) return;
                  try { _tick(); }''', '''        if (_disposed || _invoking) return;
                  _invoking = true;
                  try { _tick(); }''')
          replace(p, '''            try { _failed(error); } catch { /* Native callback boundary. */ }
                  }
              }''', '''            try { _failed(error); } catch { /* Native callback boundary. */ }
                  }
                  finally { _invoking = false; }
              }''')
          replace(p, '        if (_disposed) return; _disposed = true;', '''        if (_disposed) return;
                  if (Environment.CurrentManagedThreadId != _thread) throw new InvalidOperationException("Dispose the drag clock on its owning UI thread.");
                  _disposed = true;''')
          replace(p, '    [DllImport(CoreFoundation, EntryPoint = "CFRunLoopGetMain")]', '''    [DllImport(CoreFoundation, EntryPoint = "CFRunLoopGetCurrent")] private static extern nint CurrentLoop();
              [DllImport(CoreFoundation, EntryPoint = "CFRunLoopGetMain")]''')
          print('Native product edits applied.')
          PY
      - name: Validate product compilation
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Publish reviewed product changes and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-preview21-reviewed.yml
          git add src/ tests/
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: unify native stacking and keep caption tracking active in AppKit drag mode'
          git fetch origin work/preview21-uno-theme-native-drag
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview21-uno-theme-native-drag
