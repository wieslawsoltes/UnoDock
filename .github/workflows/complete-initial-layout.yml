name: Complete initial native geometry handoff
on:
  push:
    branches: [work/preview25-xaml-themes]
    paths: [.github/workflows/complete-initial-layout.yml]
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Integrate the creation-only handoff and bounded input observations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if text.count(old)!=1: raise RuntimeError(path+': ambiguous anchor')
              p.write_text(text.replace(old,new))
          replace('src/UnoDock/Controls/LayoutFloatingWindowControl.cs',
            '            _window.Activate();\n        }\n        else if (!_window.AppWindow.IsVisible',
            '            _window.Activate();\n            QueueInitialNativeLayout(_window);\n        }\n        else if (!_window.AppWindow.IsVisible')
          replace('tests/UnoDock.VisualTests/FloatingChromeTests.cs',
            '            var kind = tools ? "tools" : "document";',
            '            var kind = tools ? "tools" : "document";\n            RegisterInitialLayout(tests, tools);')
          replace('tests/UnoDock.Runtime.Tests/InteractionTests.cs',
            '''                input.MoveTo(scroll, new(scroll.ActualWidth - 2, 15));
                          await Task.Delay(100);
                          var before = scroll.HorizontalOffset;
                          await Task.Delay(250);
                          Check.True(scroll.HorizontalOffset > before + 5, "Scrolling did not continue while the pointer was stationary.");''',
            '''                for (var attempt = 0; attempt < 100 && DragState(host) != UnoDock.Core.DockDragState.Dragging; attempt++)
                              await Task.Delay(20);
                          Check.Equal(UnoDock.Core.DockDragState.Dragging, DragState(host));
                          var start = scroll.HorizontalOffset;
                          input.MoveTo(scroll, new(scroll.ActualWidth - 2, 15));
                          for (var attempt = 0; attempt < 100 && scroll.HorizontalOffset <= start; attempt++)
                              await Task.Delay(20);
                          Check.True(scroll.HorizontalOffset > start, "The edge pointer input did not start scrolling.");
                          var before = scroll.HorizontalOffset;
                          // Do not issue any more pointer motion. Observe continued
                          // timer-driven scrolling rather than assuming dispatcher
                          // delivery finishes within a fixed 250ms under CI load.
                          for (var attempt = 0; attempt < 100 && scroll.HorizontalOffset <= before + 5; attempt++)
                              await Task.Delay(20);
                          Check.True(scroll.HorizontalOffset > before + 5, "Scrolling did not continue while the pointer was stationary.");''')
          replace('tools/verify-floating-chrome.py',
            '        required = {f"chrome/{kind}: native frame is replaced and caption controls remain real",',
            '        required = {f"chrome/{kind}: initial client geometry settles without pointer input",\n                    f"chrome/{kind}: native frame is replaced and caption controls remain real",')
          PY
          dotnet run --project tools/SourceMaintenance -c Release -- --format .
          dotnet run --project tools/SourceMaintenance -c Release -- --check-format .
          python3 tests/metadata/test_floating_chrome.py
      - name: Compile actual Uno desktop application
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Install isolated native display
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Execute unchanged physical interaction and native geometry assertions
        env:
          UNODOCK_NATIVE_INPUT_TESTS: '1'
        run: |
          result=0
          for suite in interaction floating-chrome-documents floating-chrome-tools; do
            xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/$suite --selector $suite --suite-timeout 180 --total-timeout 240 || result=1
          done
          exit $result
      - name: Commit validated source and remove preparation worker
        run: |
          set -euo pipefail
          git rm .github/workflows/complete-initial-layout.yml
          git add src/ tests/ tools/
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: hand initial X11 geometry to the native host after activation'
          git fetch origin work/preview25-xaml-themes
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview25-xaml-themes
      - name: Preserve exact preparation source and executed results
        if: always()
        run: |
          mkdir -p artifacts
          git add src/ tests/ tools/
          git archive --format=zip "$(git write-tree)" -o artifacts/prepared-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-native-layout
          path: artifacts/
          if-no-files-found: error
