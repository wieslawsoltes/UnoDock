name: Integrate preview21 native caption paths
on:
  push:
    branches: [work/preview21-uno-theme-native-drag]
    paths: [.github/workflows/integrate-preview21.yml, tools/integrate-preview21.py]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply exact reviewed integration anchors
        run: python3 tools/integrate-preview21.py > integration-provenance.txt
      - name: Build the integrated actual Uno application
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Preserve generated product changes on this branch only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat
          git add src/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: integrate native floating caption docking and semantic resource consumers'
          git fetch origin work/preview21-uno-theme-native-drag
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview21-uno-theme-native-drag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview21-integration-evidence
          path: integration-provenance.txt
