name: Prepare offline regression toolchain
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diagnostic-toolchain.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline-regression-toolchain
          run-id: 35870070772
          github-token: ${{ github.token }}
          path: toolchain
      - name: Split restored-package cache into bounded transport segments
        run: split -b 240M -d toolchain/packages.tar.gz toolchain/packages.part-
      - uses: actions/upload-artifact@v4
        with:
          name: offline-sdk
          path: |
            toolchain/dotnet.tar.gz
            toolchain/checksums.txt
            toolchain/resolved-packages.txt
            toolchain/source-revision.txt
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: offline-packages-00
          path: toolchain/packages.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: offline-packages-01
          path: toolchain/packages.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: offline-packages-02
          path: toolchain/packages.part-02
          compression-level: 0
          retention-days: 1
