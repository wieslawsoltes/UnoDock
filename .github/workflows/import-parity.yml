name: Import validated parity implementation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/import-parity.yml']
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply reviewed complete source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          shas = ['b76b967680eab47c814d8ad2cebdff94dcb423bc','6dab7af5441b78e4d456eb76a55c81436b2dd16c','6b128c2078880c7c72e4a4df7306306c9a21aed8']
          parts = []
          for sha in shas:
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as response: blob=json.load(response)
              data=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              parts.append(data)
          compressed=b''.join(parts)
          assert hashlib.sha256(compressed).hexdigest()=='107f38298dc1205b9e91bbd2619f0cdda7bd65e48c0e22822bf0aa02c77a0d40'
          patch=lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='0c578aaa1d3c2eaeec63799188f8e83e818931b21616775547dccdf235808224'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'parity.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          print('Applied verified complete patch:',len(patch),'bytes')
          PY
      - name: Verify adapters and commit implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/generate-property-adapters.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src samples tests tools contracts docs README.md Directory.Build.props .gitignore
          git diff --cached --quiet || (git commit -m 'feat: complete model diagnostics, guarded root replacement, parity gallery and metadata regression baseline' && git pull --rebase origin main && git push origin HEAD:main)
          gh workflow run ci.yml --ref main
