name: Probe foreground attachment lifetime
on:
  push:
    branches: [work/browser-workspace-pages]
    paths: [.github/workflows/probe-browser-foreground-lifetime.yml]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [attached, isolated-brush, callback]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate one foreground mechanism in the diagnostic build
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('src/UnoDock/Internal/DockChromeButton.cs'); text=p.read_text(); mode=os.environ['VARIANT']
          if mode=='attached':
              token='        Foreground = foreground;'; assert text.count(token)==1
              text=text.replace(token,'        if (IsLoaded)\n            Foreground = foreground;')
              token='        Configure(DockChrome.Default(false));'; assert text.count(token)==1
              text=text.replace(token,token+'\n        Loaded += (_, _) => Paint();')
          elif mode=='isolated-brush':
              token='        Foreground = foreground;'; assert text.count(token)==1
              text=text.replace(token,'        Foreground = foreground is SolidColorBrush solid ? new SolidColorBrush(solid.Color) { Opacity = solid.Opacity } : foreground;')
          else:
              token='    private void Paint()\n    {'; assert text.count(token)==1
              replacement='''    protected override void OnForegroundColorChanged(Brush previous, Brush next)
              {
                  Console.WriteLine("FG CALLBACK: enter");
                  base.OnForegroundColorChanged(previous, next);
                  Console.WriteLine("FG CALLBACK: returned");
              }
          
              private void Paint()
              {'''
              text=text.replace(token,replacement)
              token='        Foreground = foreground;'; assert text.count(token)==1
              text=text.replace(token,'        Console.WriteLine("FG SET: enter loaded=" + IsLoaded);\n'+token+'\n        Console.WriteLine("FG SET: returned");')
          p.write_text(text)
          PY
      - name: Publish diagnostic source
        run: |
          dotnet workload install wasm-tools > /tmp/wasm-install.log 2>&1
          dotnet publish samples/UnoDock.Gallery -c Release -f net10.0-browserwasm -p:UnoDockTargetFrameworks=net10.0-browserwasm -p:UnoDockLibraryFrameworks=net10.0 -p:WasmShellWebAppBasePath=/UnoDock/gallery/ -o artifacts/publish > /tmp/wasm-publish.log 2>&1 || { tail -100 /tmp/wasm-publish.log; exit 1; }
          python3 -m pip install Markdown==3.8.2
          python3 tools/build-browser-site.py --publish artifacts/publish --output artifacts/serve/UnoDock
      - name: Install browser
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium > /tmp/chromium-install.log 2>&1
      - name: Check actual runtime and foreground callback completion
        working-directory: tests/browser
        run: |
          python3 -m http.server 8765 --directory ../../artifacts/serve > ../../artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          timeout 50s node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch();const page=await browser.newPage();const logs=[];
          page.on('console',m=>{logs.push(m.type()+': '+m.text());if(logs.length>100)logs.shift();});
          page.on('pageerror',e=>logs.push('ERROR '+e.stack));
          page.goto('http://127.0.0.1:8765/UnoDock/playground/',{waitUntil:'domcontentloaded',timeout:10000}).catch(e=>logs.push('NAV '+e.message));
          await new Promise(resolve=>setTimeout(resolve,25000));
          const result=await Promise.race([page.evaluate(()=>({applied:window.UnoDockBrowser?.applied,frame:document.querySelector('iframe')?.contentDocument?.body.innerText.slice(0,2000)})),new Promise(resolve=>setTimeout(()=>resolve('UI unresponsive'),3000))]);
          console.log('CALLBACKS\n'+logs.join('\n'));console.log('FINAL STATE',JSON.stringify(result));
          await fs.mkdir('../../artifacts/probe',{recursive:true});
          await fs.writeFile('../../artifacts/probe/result.json',JSON.stringify(result));
          await fs.writeFile('../../artifacts/probe/callbacks.log',logs.join('\n'));
          if(result!=='UI unresponsive') await page.screenshot({path:'../../artifacts/probe/browser.png',timeout:4000}).catch(()=>{});
          process.exit(result?.applied?.items?.length===4 ? 0 : 1);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-foreground-lifetime-${{ matrix.variant }}
          path: artifacts/probe/
