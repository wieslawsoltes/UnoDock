name: Trace browser runtime initialization
on:
  push:
    branches: [work/browser-workspace-pages]
    paths: [.github/workflows/trace-browser-runtime.yml]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          run-id: 36312920160
          name: browser-site-preview
          github-token: ${{ github.token }}
          path: artifacts/serve/UnoDock
      - name: Install browser diagnostics
        working-directory: tests/browser
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture live bridge calls and paused runtime stack
        working-directory: tests/browser
        run: |
          python3 -m http.server 8765 --directory ../../artifacts/serve > ../../artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch();
          const context = await browser.newContext({ viewport: { width: 1360, height: 900 } });
          await context.addInitScript(() => {
              let bridge;
              Object.defineProperty(window, 'UnoDockBrowser', {
                  configurable: true, get: () => bridge,
                  set: value => {
                      console.log('HOST BRIDGE INSTALLED', location.href);
                      bridge = { ...value,
                          call: request => { console.log('BRIDGE CALL', JSON.stringify(request)); const result = value.call(request); console.log('BRIDGE RESULT', result.slice(0, 300)); return result; },
                          report: data => { console.log('UNO REPORT', JSON.stringify(data).slice(0, 300)); return value.report(data); }
                      };
                      Object.defineProperty(bridge, 'applied', { get: () => value.applied });
                  }
              });
          });
          const page = await context.newPage();
          page.on('console', message => console.log('CONSOLE', message.type(), message.text().slice(0, 3000)));
          page.on('pageerror', error => console.log('PAGE ERROR', error.stack));
          page.on('requestfailed', request => console.log('REQUEST FAILURE', request.url(), request.failure()));
          const cdp = await context.newCDPSession(page);
          await cdp.send('Debugger.enable');
          await cdp.send('Profiler.enable');
          await cdp.send('Profiler.start');
          const navigation = page.goto('http://127.0.0.1:8765/UnoDock/playground/', { waitUntil: 'domcontentloaded', timeout: 20000 }).catch(e => console.log('NAVIGATION',e.message));
          await new Promise(resolve => setTimeout(resolve, 10000));
          const pause = new Promise(resolve => cdp.once('Debugger.paused', resolve));
          await cdp.send('Debugger.pause');
          const frames = await Promise.race([pause, new Promise(resolve => setTimeout(() => resolve(null), 5000))]);
          console.log('PAUSED FRAMES', JSON.stringify(frames?.callFrames?.slice(0, 50), null, 2));
          const profile = await cdp.send('Profiler.stop');
          const counts = new Map();
          for (const id of profile.profile.samples || []) counts.set(id, (counts.get(id)||0)+1);
          console.log('HOT FUNCTIONS', JSON.stringify(profile.profile.nodes.map(node=>({ samples:counts.get(node.id)||0,frame:node.callFrame })).sort((a,b)=>b.samples-a.samples).slice(0,30),null,2));
          await fs.mkdir('../../artifacts/diagnostic', {recursive:true});
          await fs.writeFile('../../artifacts/diagnostic/cpu-profile.json', JSON.stringify(profile.profile));
          await fs.writeFile('../../artifacts/diagnostic/paused.json', JSON.stringify(frames));
          await cdp.send('Debugger.resume');
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-runtime-trace
          path: artifacts/diagnostic/
