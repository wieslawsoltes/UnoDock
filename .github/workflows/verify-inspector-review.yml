name: Verify native inspector review
on:
  push:
    branches: [work/preview27-review-evidence]
    paths: [.github/workflows/verify-inspector-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 506d34c4bc15878be67ff547230eda2ebe10018b
          fetch-depth: 0
      - name: Verify final jobs, source identity and complete runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, io, json, os, subprocess, time, zipfile
          import urllib.error, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          from unittest.mock import patch

          head = '6f7a02effc29fbecbc029039712a5ecbd06509ad'
          tested = '506d34c4bc15878be67ff547230eda2ebe10018b'
          tree = '7be4ccc7d6b6b6392a8a8991a748f93128e6de47'
          base = 'eee58e7f064ae5f5e6033b2b39cf8436261cd1a2'
          runs = {'ordinary': (36266490525, 6), 'native': (36266490440, 3),
                  'chrome': (36266490523, 3), 'workbench': (36266490545, 3),
                  'workspaces': (36266490550, 3), 'source': (36266490454, 1),
                  'inspector': (36266490540, 3)}
          out = Path('artifacts/PR16-verified')
          out.mkdir(parents=True)
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'User-Agent': 'UnoDock-review-verifier'}
          def request(path):
              return urllib.request.Request('https://api.github.com/repos/wieslawsoltes/UnoDock/' + path, headers=headers)
          def get(path):
              with urllib.request.urlopen(request(path), timeout=60) as response:
                  return json.load(response)
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse', 'HEAD') == tested
          assert git('rev-parse', 'HEAD^{tree}') == git('rev-parse', head + '^{tree}') == tree
          subprocess.run(['git', 'diff', '--exit-code', base, 'HEAD', '--', 'src/', 'contracts/', 'tools/ReferenceProbe/',
                          'tests/UnoDock.VisualTests/InspectorQualityTests.cs',
                          'tests/UnoDock.VisualTests/SampleQualityTests.cs'], check=True)
          deadline = time.monotonic() + 1080
          while True:
              states = {name: get(f'actions/runs/{run}') for name, (run, _) in runs.items()}
              for name, state in states.items():
                  assert state['head_sha'] == head
                  if state['status'] == 'completed' and state['conclusion'] != 'success':
                      raise RuntimeError(f'{name}: final-head workflow failed: {state["conclusion"]}')
              print('FINAL STATES', {name: (state['status'], state['conclusion']) for name, state in states.items()}, flush=True)
              if all(state['status'] == 'completed' for state in states.values()):
                  break
              if time.monotonic() >= deadline:
                  raise TimeoutError('Final-head workflows did not complete within the verification deadline.')
              time.sleep(25)
          jobs = {}
          for name, (run, count) in runs.items():
              values = get(f'actions/runs/{run}/jobs?per_page=100')['jobs']
              assert len(values) == count and all(value['conclusion'] == 'success' for value in values), name
              jobs[name] = [{'id': value['id'], 'name': value['name'], 'conclusion': value['conclusion']} for value in values]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None
          def download(artifact):
              try:
                  response = urllib.request.build_opener(NoRedirect).open(request(f'actions/artifacts/{artifact["id"]}/zip'), timeout=60)
              except urllib.error.HTTPError as error:
                  if error.code not in (301, 302, 303, 307, 308):
                      raise
                  location = error.headers['Location']
                  assert location.startswith('https://')
                  response = urllib.request.urlopen(location, timeout=120)
              with response:
                  data = response.read(128 * 1024 * 1024 + 1)
              assert len(data) <= 128 * 1024 * 1024
              assert 'sha256:' + hashlib.sha256(data).hexdigest() == artifact['digest']
              return data
          prefixes = {'native': 'native-docking-', 'chrome': 'custom-floating-chrome-',
                      'workbench': 'xaml-workbench-', 'workspaces': 'xaml-workspaces-',
                      'inspector': 'native-inspector-'}
          artifacts = {}
          directories = {}
          source_zip = None
          for kind, (run, _) in runs.items():
              for artifact in get(f'actions/runs/{run}/artifacts?per_page=100')['artifacts']:
                  name = artifact['name']
                  selected = name in ('core-and-api-results', 'runtime-test-results', 'windows-runtime-test-results') if kind == 'ordinary' else name.startswith(prefixes[kind]) if kind in prefixes else False
                  if not selected:
                      continue
                  assert not artifact['expired'] and artifact['workflow_run']['head_sha'] == head
                  data = download(artifact)
                  directory = out / 'evidence' / name
                  directory.mkdir(parents=True)
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      for entry in archive.infolist():
                          path = PurePosixPath(entry.filename)
                          assert not path.is_absolute() and '..' not in path.parts
                          if entry.is_dir():
                              continue
                          assert entry.file_size < 128 * 1024 * 1024
                          if name == 'core-and-api-results' and path.name == 'UnoDock-source.zip':
                              source_zip = archive.read(entry)
                          # Do not distribute fonts, dependencies or executables.
                          if path.suffix.lower() not in ('.json', '.xml', '.txt', '.log', '.png'):
                              continue
                          destination = directory.joinpath(*path.parts)
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          destination.write_bytes(archive.read(entry))
                  artifacts[name] = {'id': artifact['id'], 'run': run, 'digest': artifact['digest']}
                  directories[name] = directory
          assert len(artifacts) == 18 and source_zip is not None
          blobs = {}
          for entry in subprocess.check_output(['git', 'ls-tree', '-rz', '--full-tree', 'HEAD']).split(b'\0'):
              if entry:
                  meta, path = entry.split(b'\t', 1)
                  _, kind, sha = meta.split()
                  assert kind == b'blob'
                  blobs[path.decode()] = sha.decode()
          with zipfile.ZipFile(io.BytesIO(source_zip)) as archive:
              names = {e.filename for e in archive.infolist() if not e.is_dir()}
              assert names == set(blobs)
              for name in names:
                  data = archive.read(name)
                  assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == blobs[name], name
          assert not any(name.endswith(('migrate-native-inspector.py', 'fix-native-inspector-presentation.py', 'prepare-native-inspector.yml')) for name in blobs)

          def isolation(directory, suites):
              record = json.loads((directory / 'isolated-execution.json').read_text())
              assert len(record['planned']) == len(suites) and set(record['planned']) == set(suites)
              assert len(record['completed']) == len(suites) and {row['suite'] for row in record['completed']} == set(suites)
              for row in record['completed']:
                  assert row['error'] is None and row['passed'] == row['executed'] == suites[row['suite']]
          results = {}
          for name, directory in directories.items():
              suites = {}
              for path in directory.rglob('*.xml'):
                  root = ET.parse(path).getroot()
                  if root.tag != 'testsuite':
                      continue
                  cases = root.findall('testcase')
                  names = [case.get('name') for case in cases]
                  assert cases and len(cases) == int(root.get('tests', '-1'))
                  assert all(names) and len(names) == len(set(names))
                  assert not any(int(root.get(key, '0')) for key in ('failures', 'errors', 'skipped'))
                  assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
                  suite = root.get('name')
                  assert suite and suite not in suites
                  suites[suite] = len(cases)
              assert suites
              results[name] = {'suites': suites, 'executed': sum(suites.values()), 'failed': 0, 'skipped': 0}
              system = 'Darwin' if name.endswith('-macOS') else 'Windows' if name.endswith('-Windows') else 'Linux'
              if name in ('runtime-test-results', 'windows-runtime-test-results') or name.startswith(('xaml-workbench-', 'xaml-workspaces-')):
                  isolation(directory, suites)
              if name in ('runtime-test-results', 'windows-runtime-test-results'):
                  summary = json.loads((directory / 'execution-summary.json').read_text())
                  assert summary['revision'] == tested
                  assert suites['xaml-workbench'] == 86 and suites['xaml-workspaces'] == 37 and suites['layout-mutation-invariants'] == 64
                  assert suites['native-inspector'] == (17 if name == 'runtime-test-results' else 16)
              if name.startswith(tuple(prefixes.values())):
                  assert (directory / 'source-revision.txt').read_text().strip() == tested
              if name.startswith(('native-docking-', 'custom-floating-chrome-', 'native-inspector-')):
                  script = 'tools/verify-native-inspector.py' if name.startswith('native-inspector-') else 'tools/verify-floating-chrome.py' if name.startswith('custom-') else 'tools/verify-native-results.py'
                  spec = importlib.util.spec_from_file_location('gate', script)
                  module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(module)
                  if name.startswith('native-inspector-'):
                      module.verify(directory, tested, system)
                  else:
                      with patch.object(module.platform, 'system', return_value=system):
                          module.verify(directory)
              if name.startswith('xaml-workspaces-'):
                  assert suites == {'xaml-workspaces': 37}
              if name.startswith('xaml-workbench-'):
                  assert suites == {'xaml-workbench': 86}
              print('VERIFIED', name, results[name], flush=True)
          summary = {'head': head, 'tested': tested, 'tree': tree, 'sourceFilesVerified': len(blobs),
                     'unchangedLibraryAndLegacyInspectorTests': True, 'jobs': jobs, 'artifacts': artifacts, 'results': results}
          (out / 'verification.json').write_text(json.dumps(summary, indent=2) + '\n')
          (out / 'implementation.patch').write_bytes(subprocess.check_output(['git', 'diff', '--no-ext-diff', base, 'HEAD']))
          (out / 'change-statistics.txt').write_text(git('diff', '--stat', base, 'HEAD') + '\n')
          print('FINAL VERIFIED SUMMARY', json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UnoDock-PR16-verified-evidence
          path: artifacts/PR16-verified/
          if-no-files-found: error
