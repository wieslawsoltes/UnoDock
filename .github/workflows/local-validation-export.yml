name: Local validation toolchain
on:
  push:
    branches: [work/dropdown-contracts-20260923]
    paths: [.github/workflows/local-validation-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build pinned generic Uno desktop
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Export SDK and package cache without credentials or repository data
        shell: bash
        run: |
          set -euo pipefail
          root=$(dirname "$(readlink -f "$(which dotnet)")")
          sdk=$(dotnet --version)
          stage="$RUNNER_TEMP/validation"
          mkdir -p "$stage/sdk" "$stage/nuget"
          tar -cf "$stage/sdk/dotnet.tar" -C "$root" dotnet host shared packs sdk-manifests "sdk/$sdk"
          tar -cf "$stage/nuget/packages.tar" -C "$HOME/.nuget" packages
      - uses: actions/upload-artifact@v4
        with:
          name: local-dotnet-sdk
          path: ${{ runner.temp }}/validation/sdk/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: local-uno-packages
          path: ${{ runner.temp }}/validation/nuget/
          retention-days: 1
