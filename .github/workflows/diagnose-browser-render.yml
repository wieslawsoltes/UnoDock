name: Diagnose browser render startup
on:
  push:
    branches: [work/browser-workspace-pages]
    paths: [.github/workflows/diagnose-browser-render.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instrument only this diagnostic checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          probe=Path('src/UnoDock/Internal/BrowserRenderProbe.cs')
          probe.write_text('namespace UnoDock.Internal; internal static class BrowserRenderProbe { private static int count; internal static void Mark(string s) { if (System.Threading.Interlocked.Increment(ref count) < 500) System.Console.WriteLine("RENDER-PROBE: " + s); } }')
          points={
              'src/UnoDock/DockingManager.cs': ['        _surface ??= new(this);', '            _surface.Update();', '            SyncFloatingWindows();', '            LastRenderedLayout = Layout;'],
              'src/UnoDock/Internal/DockSurface.cs': ['        _navigator?.UpdateAppearance();', '        _docked.RequestedTheme = DockThemeResources.EffectiveTheme(Manager);', '        _docked.Background = DockChrome.Palette(Manager).Header;', '        var panel = (LayoutPanelControl)GetView(root.RootPanel);', '        UpdateView(root.RootPanel);', '        Manager.LayoutRootPanel = panel;', '        VisualParenting.ReconcilePanel(_docked, [panel, top, bottom, left, right]);'],
              'src/UnoDock/Controls/LayoutGridControl.cs': ['        ValidateResize();', '                var view = surface.GetView(models[i]);', '        AttachResizeObservers();', '            surface.UpdateView(models[i]);'],
              'src/UnoDock/Controls/LayoutCachePaneControl.cs': ['        BindPane(pane);', '                tab = CreateTabItem(model) ?? throw new InvalidOperationException("The tab factory returned null.");', '            tab.Update(surface.Manager);', '            var item = surface.Manager.GetLayoutItemFromModel(model);', '            item.UpdateView();', '            var presenter = ReferenceEquals(model, selected) ? item.View : item.ExistingView;', '        VisualParenting.ReconcilePanel(_headers, tabViews);', '        VisualParenting.ReconcilePanel(_content, contentViews);', '        UpdatePaneChrome(pane, models, surface.Manager);', '        SynchronizeSelection();', '        RevealSelectedHeader(selected);']}
          for path,anchors in points.items():
              p=Path(path); text=p.read_text()
              for n,anchor in enumerate(anchors):
                  exact='\n'+anchor+'\n'
                  assert text.count(exact)==1,(path,anchor,text.count(exact))
                  indent=anchor[:len(anchor)-len(anchor.lstrip())]
                  label=path.split('/')[-1]+':'+str(n)
                  text=text.replace(exact,'\n'+indent+'UnoDock.Internal.BrowserRenderProbe.Mark("'+label+' before");\n'+anchor+'\n'+indent+'UnoDock.Internal.BrowserRenderProbe.Mark("'+label+' after");\n')
              p.write_text(text)
          PY
      - name: Publish instrumented actual Uno host
        run: |
          dotnet workload install wasm-tools > /tmp/workload.log 2>&1
          dotnet publish samples/UnoDock.Gallery -c Release -f net10.0-browserwasm -p:UnoDockTargetFrameworks=net10.0-browserwasm -p:UnoDockLibraryFrameworks=net10.0 -p:WasmShellWebAppBasePath=/UnoDock/gallery/ -o artifacts/publish > /tmp/build.log 2>&1 || { tail -80 /tmp/build.log; exit 1; }
          python3 -m pip install Markdown==3.8.2
          python3 tools/build-browser-site.py --publish artifacts/publish --output artifacts/serve/UnoDock
      - name: Install locked browser runtime
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium > /tmp/chromium.log 2>&1
      - name: Trace one real startup with a hard deadline
        working-directory: tests/browser
        run: |
          mkdir -p ../../artifacts/diagnostic
          cat > render-probe.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          page.on('console', msg => console.log('BROWSER',msg.type(),msg.text()));
          page.on('pageerror', e => console.error('BROWSER-ERROR',e.stack));
          const cdp = await page.context().newCDPSession(page);
          await cdp.send('Profiler.enable'); await cdp.send('Profiler.start');
          await page.goto('http://127.0.0.1:8765/UnoDock/playground/',{waitUntil:'commit'});
          await new Promise(r=>setTimeout(r,20000));
          console.log('COLLECTING PROFILE');
          await fs.writeFile('../../artifacts/diagnostic/profile.json',JSON.stringify(await cdp.send('Profiler.stop')));
          console.log('RUNTIME REPORT',await page.evaluate(()=>window.UnoDockBrowser.applied));
          await page.screenshot({path:'../../artifacts/diagnostic/startup.png'});
          await browser.close();
          JS
          python3 -m http.server 8765 --directory ../../artifacts/serve > ../../artifacts/diagnostic/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          set +e
          timeout --kill-after=5s 65s node render-probe.mjs > ../../artifacts/diagnostic/browser.log 2>&1
          result=$?
          set -e
          cat ../../artifacts/diagnostic/browser.log
          echo "$result" > ../../artifacts/diagnostic/process-exit.txt
          test "$result" -eq 0
      - name: Preserve diagnostic source delta
        if: always()
        run: |
          mkdir -p artifacts/diagnostic
          git diff > artifacts/diagnostic/instrumentation.patch
          cp /tmp/build.log artifacts/diagnostic/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-render-diagnostic
          path: artifacts/diagnostic/
