name: Isolate browser foreground propagation
on:
  push:
    branches: [work/browser-workspace-pages]
    paths: [.github/workflows/probe-browser-foreground.yml]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [idempotent, omit-foreground, dom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply isolated diagnostic variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          mode=os.environ['VARIANT']
          if mode in ('idempotent','omit-foreground'):
              p=Path('src/UnoDock/Internal/DockChromeButton.cs'); text=p.read_text()
              token='        Foreground = foreground;'; assert text.count(token)==1
              replacement='        if (!ReferenceEquals(Foreground, foreground))\n            Foreground = foreground;' if mode=='idempotent' else '        // Diagnostic only: do not publish the foreground property.'
              p.write_text(text.replace(token,replacement))
          else:
              p=Path('samples/UnoDock.Gallery/UnoDock.Gallery.csproj'); text=p.read_text()
              assert text.count('<UnoFeatures>SkiaRenderer;</UnoFeatures>')==1
              p.write_text(text.replace('<UnoFeatures>SkiaRenderer;</UnoFeatures>','<UnoFeatures></UnoFeatures>'))
              Path('samples/UnoDock.Gallery/Platforms/WebAssembly/Program.cs').write_text('''namespace UnoDock.Gallery;
          public static class Program { private static App? _app; public static int Main(string[] args) { Microsoft.UI.Xaml.Application.Start(_ => _app = new App()); return 0; } }
          ''')
          PY
      - name: Compile clean browser variant
        run: |
          dotnet workload install wasm-tools > /tmp/wasm-install.log 2>&1
          dotnet publish samples/UnoDock.Gallery -c Release -f net10.0-browserwasm -p:UnoDockTargetFrameworks=net10.0-browserwasm -p:UnoDockLibraryFrameworks=net10.0 -p:WasmShellWebAppBasePath=/UnoDock/gallery/ -o artifacts/publish > /tmp/wasm-publish.log 2>&1 || { tail -100 /tmp/wasm-publish.log; exit 1; }
          python3 -m pip install Markdown==3.8.2
          python3 tools/build-browser-site.py --publish artifacts/publish --output artifacts/serve/UnoDock
      - name: Install browser
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium > /tmp/chromium-install.log 2>&1
      - name: Require a responsive runtime and capture actual state
        working-directory: tests/browser
        run: |
          python3 -m http.server 8765 --directory ../../artifacts/serve > ../../artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          timeout 50s node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch();const page=await browser.newPage();
          page.on('console',m=>console.log('BROWSER',m.type(),m.text().slice(0,3000)));
          page.on('pageerror',e=>console.log('ERROR',e.stack));
          page.goto('http://127.0.0.1:8765/UnoDock/playground/',{waitUntil:'domcontentloaded',timeout:10000}).catch(e=>console.log('NAV',e.message));
          await new Promise(resolve=>setTimeout(resolve,25000));
          const result=await Promise.race([page.evaluate(()=>({applied:window.UnoDockBrowser?.applied,frame:document.querySelector('iframe')?.contentDocument?.body.innerText.slice(0,2000)})),new Promise(resolve=>setTimeout(()=>resolve('UI unresponsive'),3000))]);
          console.log('FINAL STATE',JSON.stringify(result));
          await fs.mkdir('../../artifacts/probe',{recursive:true});
          await fs.writeFile('../../artifacts/probe/result.json',JSON.stringify(result));
          if(result!=='UI unresponsive') await page.screenshot({path:'../../artifacts/probe/browser.png',timeout:4000}).catch(()=>{});
          process.exit(result?.applied?.items?.length===4 ? 0 : 1);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-foreground-${{ matrix.variant }}
          path: artifacts/probe/
