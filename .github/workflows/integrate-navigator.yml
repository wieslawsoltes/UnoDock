name: Integrate verified navigator implementation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/integrate-navigator.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: integrate-navigator
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify and apply the complete reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          shas = ['cd0430e97092870fef886a7b0f0edf1f445b98e7', '3f3cc57f6234d0043fd1dbd2c99c120d3d7264e4', 'df07e18718667afd1a8f052b8b44c441ed139bac']
          pieces = []
          for sha in shas:
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response: blob = json.load(response)
              value = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest() == sha
              pieces.append(value)
          compressed = b''.join(pieces)
          assert hashlib.sha256(compressed).hexdigest() == '9557e193a698ccbb422a36053c3df803c9a2a761ca476ed9380c17f1ccabf69c'
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'navigator.patch'
          patch.write_bytes(lzma.decompress(compressed))
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True)
          names = [line.split('\t', 2)[2] for line in stats.splitlines()]
          assert len(names) == 21, len(names)
          for name in names:
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('Directory.Build.props', 'README.md', 'src', 'tests', 'samples', 'contracts', 'docs')
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          # A disposable index verifies every source blob, including unchanged files.
          # Exclude only this one-use workflow, which did not exist in the reviewed tree.
          index = pathlib.Path(os.environ['RUNNER_TEMP']) / 'navigator-verify.index'
          index.write_bytes(pathlib.Path('.git/index').read_bytes())
          env = dict(os.environ, GIT_INDEX_FILE=str(index))
          subprocess.run(['git', 'update-index', '--force-remove', '.github/workflows/integrate-navigator.yml'], env=env, check=True)
          tree = subprocess.check_output(['git', 'write-tree'], env=env, text=True).strip()
          assert tree == 'aaa9ea3088b8f6e4cc78d45603a8f9392553bb11', 'Concurrent or unexpected source tree: ' + tree
          print(stats)
          print('Verified complete reviewed source tree: ' + tree)
          PY
      - name: Build complete SDK and XAML desktop application with warnings as errors
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Run portable tests and deterministic API regression gate
        run: |
          dotnet run --project tests/UnoDock.Core.Tests -c Release -- artifacts/test-results
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- src/
          bash tools/check-metadata.sh
          git diff --cached --check
      - name: Commit implementation and dispatch all platform tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: render real navigator rows, preserve identity and scrolling, and match observed stock chrome'
          git push origin HEAD:main
          git rev-parse HEAD > artifacts/integrated-revision.txt
          gh workflow run ci.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigator-integration-results
          path: artifacts/
