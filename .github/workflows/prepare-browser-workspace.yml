name: Prepare browser workspace implementation
on:
  push:
    branches: [work/browser-workspace-pages]
    paths: [.github/workflows/prepare-browser-workspace.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate reviewed browser host and retired-session guards
        run: |
          python3 tools/prepare-browser-workspace.py
          python3 tools/prepare-browser-refinements.py
      - name: Verify protocol and canonical C# sources
        run: |
          node --test tests/browser/session.test.mjs
          dotnet run --project tools/SourceMaintenance -c Release -- --format .
          dotnet run --project tools/SourceMaintenance -c Release -- --check .
          dotnet run --project tools/SourceMaintenance -c Release -- --check-format .
      - name: Compile desktop API compatibility
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Preserve compiled integration on the review branch
        run: |
          set -euo pipefail
          git add src/ samples/ README.md
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: integrate compiled browser workspace and guarded cross-window ownership'
          git fetch origin work/browser-workspace-pages
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/browser-workspace-pages
      - name: Publish actual Uno WebAssembly
        run: |
          dotnet workload install wasm-tools
          dotnet publish samples/UnoDock.Gallery -c Release -f net10.0-browserwasm -p:UnoDockTargetFrameworks=net10.0-browserwasm -p:UnoDockLibraryFrameworks=net10.0 -p:WasmShellWebAppBasePath=/UnoDock/gallery/ -o artifacts/publish
      - name: Build documentation and browser shell
        run: |
          python3 -m pip install Markdown==3.8.2
          python3 tools/build-browser-site.py --publish artifacts/publish --output artifacts/site
          mkdir -p artifacts/serve
          ln -s ../site artifacts/serve/UnoDock
      - name: Install Chromium acceptance runtime
        working-directory: tests/browser
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Execute real multi-window browser acceptance
        working-directory: tests/browser
        run: |
          python3 -m http.server 8765 --directory ../../artifacts/serve > ../../artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          npx playwright test
      - name: Preserve source and result diagnostics
        if: always()
        run: |
          mkdir -p artifacts/review
          git rev-parse HEAD > artifacts/review/source-revision.txt
          git diff > artifacts/review/uncommitted.patch
          git archive --format=zip -o artifacts/review/source.zip HEAD
          if [ -f tests/browser/package-lock.json ]; then cp tests/browser/package-lock.json artifacts/review/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-workspace-preparation
          path: |
            artifacts/browser-tests/
            artifacts/review/
            artifacts/http.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-site-preview
          path: artifacts/site/
