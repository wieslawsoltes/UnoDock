name: Dropdown integration corrections
on:
  push:
    branches: [work/dropdown-lifecycle-20260923]
    paths: [.github/workflows/dropdown-fixup.yml]
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dropdown-lifecycle-20260923
          fetch-depth: 0
      - name: Apply checked host-key and test-registration corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def change(name, old, new):
              p=Path(name); text=p.read_text()
              if new in text: return
              assert text.count(old)==1, name
              p.write_text(text.replace(old,new))
          old='''if (e.Key == Windows.System.VirtualKey.Application ||
                      (e.Key == Windows.System.VirtualKey.F10 &&
                       (InputKeyboardSource.GetKeyStateForCurrentThread(Windows.System.VirtualKey.Shift) & Windows.UI.Core.CoreVirtualKeyStates.Down) != 0))'''
          change('src/UnoDock/Controls/DropDownControls.cs', old, 'if (DropDownKeyboard.IsContextRequest(this, e))')
          change('tests/UnoDock.VisualTests/DropDownQualityTests.cs', '        DropDownTransitionTests.Register(tests, root, window);', '        DropDownTransitionTests.Register(tests, root, window);\n        DropDownKeyboardTests.Register(tests, root, window);')
          p=Path('docs/dropdown-quality.md'); text=p.read_text().replace('three opt-in Linux XTEST cases.', 'six opt-in Linux XTEST cases.')
          text=text.replace('The context-menu key and Shift+F10 are supported through keyboard and native', 'The pinned X11 host reports XK_Menu as VirtualKey.Menu, unlike its LeftMenu/RightMenu Alt keys. A host-checked adapter recognizes that distinction; native tests verify both Alt keys remain inert.\n\nThe context-menu key and Shift+F10 are supported through keyboard and native')
          p.write_text(text)
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build complete SDK and XAML sample with warnings as errors
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Commit exact corrected source and dispatch platform validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs
          git diff --cached --check
          git diff --cached --quiet || (git commit -m 'fix: recognize native X11 context-menu key without consuming Alt' && git push origin HEAD:work/dropdown-lifecycle-20260923)
          gh workflow run dropdown-acceptance.yml --ref work/dropdown-lifecycle-20260923
          gh workflow run ci.yml --ref work/dropdown-lifecycle-20260923
