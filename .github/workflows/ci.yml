name: Build and test
on:
  push:
    branches: [main]
    paths-ignore: ['tools/ReferenceProbe/**', '.github/workflows/reference-metadata.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Portable regression and randomized tests
        run: dotnet run --project tests/UnoDock.Core.Tests -c Release -- artifacts/test-results
      - name: Check generated adapters and namespace invariants
        run: |
          python3 tools/generate-property-adapters.py
          git diff --exit-code -- src/
          python3 tests/metadata/test_namespace_migration.py
          python3 tests/metadata/test_desktop_runner.py
      - name: Scan implementation and report every declaration difference
        run: |
          dotnet run --project tools/ApiScan -- src/UnoDock artifacts/unodock-api
          python3 tools/audit-api.py artifacts/unodock-api.json
      - name: Resolve and compare public API metadata
        run: bash tools/check-metadata.sh
      - name: Summarize executed portable cases
        if: always()
        run: python3 tools/report-test-results.py artifacts/test-results --output artifacts/core-summary.json
      - name: Archive exact checked-out sources
        run: |
          git archive --format=zip -o artifacts/UnoDock-source.zip HEAD
          git rev-parse HEAD > artifacts/source-revision.txt
          sha256sum artifacts/UnoDock-source.zip > artifacts/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-and-api-results
          path: artifacts/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build actual Uno desktop application with warnings as errors
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Install headless desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Run real Uno runtime and original-layout interoperability tests
        id: linux_runtime
        if: runner.os == 'Linux'
        env:
          UNODOCK_SELFTEST: '1'
          UNODOCK_NATIVE_INPUT_TESTS: '1'
          UNODOCK_TEST_RESULTS: ${{ github.workspace }}/artifacts/test-results
        run: xvfb-run -a -s "-screen 0 2560x1440x24" python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/test-results
      - name: Run Windows lifecycle, HWND filter, input, navigator and visual tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UNODOCK_SELFTEST: '1'
          UNODOCK_TEST_SUITE: windows-acceptance
          UNODOCK_TEST_RESULTS: ${{ github.workspace }}/artifacts/test-results
        run: python tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/test-results --selector windows-acceptance
      - name: Summarize executed platform cases and failing assertions
        if: always() && (runner.os == 'Linux' || runner.os == 'Windows')
        shell: bash
        run: python3 tools/report-test-results.py artifacts/test-results --output artifacts/test-results/execution-summary.json
      - uses: actions/upload-artifact@v4
        if: always() && (runner.os == 'Linux' || runner.os == 'Windows')
        with:
          name: visual-parity-${{ runner.os }}
          path: artifacts/test-results/visuals/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-runtime-test-results
          path: artifacts/test-results/
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: runtime-test-results
          path: artifacts/test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            artifacts/test-results/
            samples/UnoDock.Gallery/bin/Release/net10.0-desktop/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools
      - name: Publish browser gallery
        run: dotnet publish samples/UnoDock.Gallery -c Release -f net10.0-browserwasm -p:UnoDockTargetFrameworks=net10.0-browserwasm -p:UnoDockLibraryFrameworks=net10.0 -o artifacts/browser
      - uses: actions/upload-artifact@v4
        with:
          name: browser-gallery
          path: artifacts/browser/
  packages:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build generic Uno and native WinUI package targets
        run: msbuild src/UnoDock/UnoDock.csproj -restore -t:Pack -p:Configuration=Release -p:PackageOutputPath=${{ github.workspace }}/artifacts/packages -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
      - name: Package independent core
        run: dotnet pack src/UnoDock.Core -c Release -o artifacts/packages -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-preview
          path: artifacts/packages/
