name: Restore recovered implementation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/import.yml']
permissions:
  contents: write
  actions: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recovered-source
          run-id: 35656033458
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/recovered
      - name: Restore complete files only from the pinned verified payload
        env:
          PAYLOAD: ${{ runner.temp }}/recovered/payload
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          data=pathlib.Path(os.environ['PAYLOAD']).read_bytes()
          assert hashlib.sha256(data).hexdigest()=='0db1b5a98fb79ca3f17188453893aafd5a675241df63ee376d55781b1e89827d'
          text=data.decode('utf-8'); decoder=json.JSONDecoder(); pos=1; recovered={}
          while pos < len(text):
              name,pos=decoder.raw_decode(text,pos)
              assert text[pos]==':';pos+=1
              try: value,end=decoder.raw_decode(text,pos)
              except json.JSONDecodeError: break
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert not name.startswith('.github/')
              recovered[name]=value;pos=end
              if pos>=len(text) or text[pos]!=',':break
              pos+=1
          assert len(recovered)==43
          assert name=='src/UnoDock.Core/Geometry.cs',name
          for name,value in recovered.items():
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value,encoding='utf-8')
          print('Restored 43 complete implementation files. Truncated core file was not imported.')
          PY
      - name: Commit recovered sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Directory.Build.props LICENSE README.md UnoDock.slnx global.json docs samples src
          git diff --cached --quiet || (git commit -m 'feat: restore independent Uno docking models, controls and interactive gallery' && git pull --rebase origin main && git push origin HEAD:main)
