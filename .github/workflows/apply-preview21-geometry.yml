name: Apply verified native geometry fixes
on:
  push:
    branches: [work/preview21-uno-theme-native-drag]
    paths: [.github/workflows/apply-preview21-geometry.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply exact reviewed changes and verify their complete Git tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 21bb88ad23534d100ab303adaaafdab5895de311
          python3 - <<'PY'
          from pathlib import Path
          pending = {}
          def replace(path, old, new, count=1):
              text = pending.get(path, Path(path).read_text())
              if text.count(old) != count: raise RuntimeError(f'{path}: unexpected integration anchor count')
              pending[path] = text.replace(old, new)
          replace('src/UnoDock/DesktopWindowCoordinates.Native.cs', '''    internal static Point NativeOrigin(Window window)
              {
          #if !WINDOWS
                  if (OperatingSystem.IsMacOS()) return MacDesktopInterop.Origin(window);
          #endif
                  return new(window.AppWindow.Position.X, window.AppWindow.Position.Y);
              }
          ''', '''    internal static Point NativeOrigin(Window window)
              {
                  using var coordinates = new DesktopWindowCoordinates();
                  return coordinates.GetNativeOrigin(window);
              }
              internal Point GetNativeOrigin(Window window)
              {
                  Verify();
                  ArgumentNullException.ThrowIfNull(window);
                  // AppWindow.Position is notification-driven on some hosts. A drag can
                  // start or cancel before the last ConfigureNotify reaches that cache.
                  if (OperatingSystem.IsWindows())
                  {
                      if (!W32.GetWindowRect(WindowsHandle(window), out var frame))
                          throw new InvalidOperationException("The native window geometry is unavailable.");
                      return new(frame.Left, frame.Top);
                  }
          #if !WINDOWS
                  if (OperatingSystem.IsMacOS()) return MacDesktopInterop.Origin(window);
                  if (OperatingSystem.IsLinux() && Uno.UI.Xaml.WindowHelper.GetNativeWindow(window) is Uno.UI.NativeElementHosting.X11NativeWindow native)
                  {
                      var id = Id(native.WindowId); var root = RootX11(id);
                      var frame = BoundsX11(TopLevelX11(id, root), root);
                      return new(frame.X, frame.Y);
                  }
          #endif
                  throw new PlatformNotSupportedException("This desktop host needs an explicit native geometry adapter.");
              }
          ''')
          p = 'src/UnoDock/Controls/LayoutFloatingWindowControl.Drag.cs'
          replace(p, 'DesktopWindowCoordinates.NativeOrigin(', '_dragCoordinates.GetNativeOrigin(', 4)
          replace(p, '        internal bool Started, CompletionQueued;', '        internal bool Started, CompletionQueued;\n        internal Point? LastRequestedOrigin;')
          replace(p, '''                if (drag.Window != null) DesktopWindowCoordinates.MoveNative(drag.Window, new(drag.Origin.X + dx, drag.Origin.Y + dy));
                          else SetBounds(drag.Bounds with { X = drag.Bounds.X + dx, Y = drag.Bounds.Y + dy });''', '''                var origin = new Point(drag.Origin.X + dx, drag.Origin.Y + dy);
                          if (drag.LastRequestedOrigin != origin)
                          {
                              // Do not flood the native event queue with identical moves
                              // while the pointer is stationary and guides are refreshing.
                              drag.LastRequestedOrigin = origin;
                              if (drag.Window != null) DesktopWindowCoordinates.MoveNative(drag.Window, origin);
                              else SetBounds(drag.Bounds with { X = origin.X, Y = origin.Y });
                          }''')
          replace('src/UnoDock/Controls/LayoutFloatingWindowControl.cs', '''            SynchronizeNativeState(new(native.Position.X / scale, native.Position.Y / scale,
                          native.Size.Width / scale, native.Size.Height / scale), state);''', '''            try
                      {
                          var origin = _dragCoordinates.GetNativeOrigin(window);
                          var positionScale = OperatingSystem.IsMacOS() ? 1 : scale;
                          SynchronizeNativeState(new(origin.X / positionScale, origin.Y / positionScale,
                              native.Size.Width / scale, native.Size.Height / scale), state);
                      }
                      catch (Exception error) when (DockCoordinates.IsUnavailable(error)) { FailCaptionDrag(error); }''')
          p = 'tests/UnoDock.Runtime.Tests/X11TestInput.cs'
          text = Path(p).read_text(); start = text.index('    internal void MoveTo('); end = text.index('    internal void Press(', start)
          pending[p] = text[:start] + '''    internal Point ScreenPoint(FrameworkElement element, Point point)
              {
                  ObjectDisposedException.ThrowIf(_display == 0, this);
                  var root = element.XamlRoot ?? throw new InvalidOperationException("Target element is detached.");
                  var window = Uno.UI.ApplicationHelper.Windows.Single(w => ReferenceEquals(w.Content?.XamlRoot, root));
                  if (Uno.UI.Xaml.WindowHelper.GetNativeWindow(window) is not Uno.UI.NativeElementHosting.X11NativeWindow native)
                      throw new InvalidOperationException("Input test requires an X11 native window.");
                  // The independent oracle uses Xlib; production geometry uses checked XCB.
                  if (TranslateCoordinates(_display, native.WindowId, DefaultRootWindow(_display), 0, 0, out var x, out var y, out _) == 0)
                      throw new InvalidOperationException("The native window is on another screen.");
                  var client = element.TransformToVisual(null).TransformPoint(point);
                  return new(x + client.X * root.RasterizationScale, y + client.Y * root.RasterizationScale);
              }
          
              internal void MoveTo(FrameworkElement element, Point point)
              {
                  var screen = ScreenPoint(element, point);
                  Check.True(FakeMotion(_display, -1, checked((int)Math.Round(screen.X)), checked((int)Math.Round(screen.Y)), 0) != 0);
                  // Fence server-side motion before the next press is injected. Application
                  // delivery remains asynchronous; callers still wait for actual UI state.
                  Sync(_display, false);
              }
          
          ''' + text[end:]
          replace(p, '    [DllImport("libX11.so.6", EntryPoint = "XOpenDisplay")]', '''    [DllImport("libX11.so.6", EntryPoint = "XSync")] private static extern int Sync(nint display, [MarshalAs(UnmanagedType.Bool)] bool discard);
              [DllImport("libX11.so.6", EntryPoint = "XOpenDisplay")]''')
          p = 'tests/UnoDock.VisualTests/DesktopFloatingTests.cs'
          replace(p, 'var origin = f.Control.NativeWindow!.AppWindow.Position;', '''var origin = input.ScreenPoint(f.Control, new(0, 0));
                                  var modelOrigin = new Point(f.Source[0].FloatingLeft, f.Source[0].FloatingTop);''')
          replace(p, '''                            await Task.Delay(80);
                                      Check.Equal(origin.X, f.Control.NativeWindow!.AppWindow.Position.X);
                                      Check.Equal(origin.Y, f.Control.NativeWindow.AppWindow.Position.Y);''', '''                            // AppWindow.Position is an asynchronous Uno cache, not
                                      // the OS geometry oracle. Assert the actual X server and
                                      // our persisted model, including late queued notifications.
                                      await Wait(() => input.ScreenPoint(f.Control, new(0, 0)) == origin &&
                                          f.Source.All(c => c.FloatingLeft == modelOrigin.X && c.FloatingTop == modelOrigin.Y));
                                      await Task.Delay(80);
                                      Check.Equal(origin, input.ScreenPoint(f.Control, new(0, 0)));
                                      Check.True(f.Source.All(c => c.FloatingLeft == modelOrigin.X && c.FloatingTop == modelOrigin.Y));''')
          replace(p, '            Add("native coordinate round-trip and source-window stacking exclusion", true, tools, async f =>', '''            Add("native origin observes a synchronous move without relying on cached notifications", true, tools, async f =>
                      {
                          var window = f.Control.NativeWindow!;
                          var origin = (Point)CallStatic(typeof(DesktopWindowCoordinates), "NativeOrigin", window)!;
                          var target = new Point(origin.X + 31, origin.Y + 17);
                          CallStatic(typeof(DesktopWindowCoordinates), "MoveNative", window, target);
                          var actual = (Point)CallStatic(typeof(DesktopWindowCoordinates), "NativeOrigin", window)!;
                          Check.Near(target.X, actual.X, 1); Check.Near(target.Y, actual.Y, 1);
                          CallStatic(typeof(DesktopWindowCoordinates), "MoveNative", window, origin);
                          actual = (Point)CallStatic(typeof(DesktopWindowCoordinates), "NativeOrigin", window)!;
                          Check.Near(origin.X, actual.X, 1); Check.Near(origin.Y, actual.Y, 1);
                          await Task.CompletedTask;
                      });
                      Add("native coordinate round-trip and source-window stacking exclusion", true, tools, async f =>''')
          for path in ['tools/verify-native-results.py', 'tests/metadata/test_native_acceptance.py']:
              replace(path, '38 if system == "Linux" else 34', '40 if system == "Linux" else 36')
          for path, content in pending.items(): Path(path).write_text(content)
          PY
          git add src/ tests/ tools/
          git rm .github/workflows/apply-preview21-geometry.yml
          git diff --cached --check
          test "$(git write-tree)" = 3149845405bf03728294926fdd3b2789297c09e8
          git diff --cached --stat
      - name: Validate actual Uno compilation and evidence tests
        run: |
          python3 tests/metadata/test_native_acceptance.py
          dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Publish only the verified tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: use live native geometry for caption movement and cancellation persistence'
          git fetch origin work/preview21-uno-theme-native-drag
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview21-uno-theme-native-drag
