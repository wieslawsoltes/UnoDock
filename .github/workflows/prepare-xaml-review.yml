name: Prepare compiled XAML review
on:
  push:
    branches: [work/preview25-xaml-themes]
    paths: [.github/workflows/prepare-xaml-review.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply hash-verified reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path
          blobs = ['1521ba06b6b2db7eeb77b11aebc907a9ac0de1c2', '3ce7074fa999b666de1731cd9e028206ada7a156', '8422bf12bd951b93271dab940938d154724f09f7']
          def blob_hash(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          chunks = []
          for sha in blobs:
              request = urllib.request.Request('https://api.github.com/repos/wieslawsoltes/UnoDock/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'UnoDock-reviewed-source-transfer'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  metadata = json.load(response)
              assert metadata['encoding'] == 'base64' and metadata['sha'] == sha
              data = base64.b64decode(metadata['content'])
              assert blob_hash(data) == sha
              chunks.append(data)
          encoded = b''.join(chunks)
          assert blob_hash(encoded) == 'cc5449198c71802a98ecfb5a89ea5111a1171930'
          compressed = base64.b64decode(encoded)
          assert hashlib.sha256(compressed).hexdigest() == '3a7fe62137648aa3fbb838668db800e025b8869bb0d0da51e182067594b12eaa'
          patch = lzma.decompress(compressed)
          assert len(patch) == 149522 and hashlib.sha256(patch).hexdigest() == '61e82c9468bbe36136efcc58042ef8eb351c482e54a91e2a3732cf748c0982a7'
          Path('/tmp/xaml-review.patch').write_bytes(patch)
          # The workflow edit was applied explicitly through the authorized connector.
          # The job token only publishes product sources, not workflow modifications.
          exclude = '--exclude=.github/workflows/source-quality.yml'
          subprocess.run(['git', 'apply', exclude, '--check', '/tmp/xaml-review.patch'], check=True)
          subprocess.run(['git', 'apply', exclude, '/tmp/xaml-review.patch'], check=True)
          subprocess.run(['git', 'add', 'src/', 'samples/', 'tests/', 'docs/', 'README.md'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          allowed = ('src/UnoDock/', 'samples/UnoDock.Gallery/', 'tests/UnoDock.VisualTests/XamlWorkspaceTests')
          exact = {'README.md', 'docs/xaml-support.md', 'tests/metadata/test_xaml_sources.py'}
          assert len(paths) == 47 and all(path.startswith(allowed) or path in exact for path in paths), paths
          assert 'python3 tests/metadata/test_xaml_sources.py' in Path('.github/workflows/source-quality.yml').read_text()
          subprocess.run(['git', 'diff', '--cached', '--stat'], check=True)
          print('Verified exact reviewed patch and allowed source scope.')
          PY
      - name: Canonical source organization and formatting
        run: |
          dotnet run --project tools/SourceMaintenance -c Release -- --format .
          dotnet run --project tools/SourceMaintenance -c Release -- --check .
          dotnet run --project tools/SourceMaintenance -c Release -- --check-format .
          python3 tests/metadata/test_source_maintenance.py
          python3 tests/metadata/test_source_formatting.py
          python3 tests/metadata/test_xaml_sources.py
          python3 tools/generate-property-adapters.py
          git diff HEAD --exit-code -- 'src/**/*.g.cs' contracts/ tools/ReferenceProbe/ .github/
          git diff --check
      - name: Build actual Uno desktop host with warnings as errors
        run: dotnet build samples/UnoDock.Gallery -c Release -f net10.0-desktop -p:UnoDockTargetFrameworks=net10.0-desktop -p:UnoDockLibraryFrameworks=net10.0 -warnaserror
      - name: Install isolated desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxrandr2 libxcursor1 libfontconfig1 libgl1 libice6 libsm6 libxcb1 libxtst6
      - name: Exercise compiled XAML and existing model invariants
        env:
          UNODOCK_SELFTEST: '1'
        run: |
          xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/xaml-prepare --selector xaml-workspaces --suite-timeout 180 --total-timeout 240
          xvfb-run -a -s '-screen 0 2560x1440x24' python3 tools/run-desktop-tests.py --app samples/UnoDock.Gallery/bin/Release/net10.0-desktop/UnoDock.Gallery.dll --output artifacts/invariants-prepare --selector layout-mutation-invariants --suite-timeout 90 --total-timeout 120
      - name: Preserve validated implementation and remove preparation workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-xaml-review.yml
          git add src/ samples/ tests/ docs/ README.md
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: compiled XAML workspaces, binding adapters and configurable Uno themes'
          git rev-parse HEAD > artifacts/prepared-revision.txt
          git diff 04e4336ac91bafc11100fb91d5cc721a093a9d5b HEAD > artifacts/implementation.patch
          git archive -o artifacts/prepared-source.zip HEAD
          git fetch origin work/preview25-xaml-themes
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git push origin HEAD:work/preview25-xaml-themes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-xaml-preparation
          path: artifacts/
