<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>UnoDock — Browser workbench</title><link rel="stylesheet" href="./workbench.css"></head>
<body>
<header><a class="brand" href="../">▦ <strong>UnoDock</strong></a><span class="divider"></span><strong id="window-title">Browser workbench</strong><span class="badge">UNO · WEBASSEMBLY</span><a href="../docs/browser-workspaces.html" target="_blank" rel="noopener">Guide</a><button id="theme" title="Switch all workspace windows between light and dark">Theme</button></header>
<nav aria-label="Browser window commands">
<button id="new-document">New document</button><button id="new-tool">New tool</button><button id="float" class="primary" disabled>Float in browser window</button><button id="return" hidden>Dock all & close window</button><span class="divider"></span>
<label class="sr-only" for="destination">Destination window</label><select id="destination"></select><label class="sr-only" for="placement">Dock position</label><select id="placement"><option value="center">As tab</option><option value="left">Left</option><option value="right">Right</option><option value="top">Top</option><option value="bottom">Bottom</option></select><button id="move">Move</button><button id="export">Export backup</button><label class="sr-only" for="closed">Closed content</label><select id="closed"><option value="">Reopen closed content…</option></select>
</nav>
<div class="transfer"><span class="hint">DRAG BETWEEN WINDOWS</span><div id="chips" role="toolbar" aria-label="Transfer content between browser windows"></div></div>
<main><iframe id="app" title="UnoDock WebAssembly workspace" allow="clipboard-read; clipboard-write"></iframe><div id="zones" hidden aria-label="Browser docking targets"><div data-zone="top">Dock above</div><div data-zone="left">Dock left</div><div data-zone="center">Dock as a tab</div><div data-zone="right">Dock right</div><div data-zone="bottom">Dock below</div></div><section id="recovery" hidden><h1>Workspace connection ended</h1><p>The browser journal retains the latest successfully saved content. Recover it in this window.</p><button id="recover">Recover workspace</button></section></main>
<footer id="status" role="status" aria-live="polite">Starting the Uno WebAssembly renderer…</footer>
<script type="module" src="./host.mjs"></script></body></html>
